        const checkUserRole = (email) => {
            if (!email) return ROLES.VIEWER;
            if (email.toLowerCase() === 'a0935505590@gmail.com') return ROLES.OPERATOR;
            if (email.toLowerCase() === 'aa0980115055@gmail.com') return ROLES.VIEWER;

        const formatBoxQty = (val) => {
            if (val === undefined || val === null) return '0';
            const num = parseFloat(Number(val));
            if (isNaN(num)) return '0';
            const fixedNum = parseFloat(num.toFixed(4));
            const intPart = Math.floor(fixedNum);
            const decPart = fixedNum - intPart;
            const packs = Math.round(decPart * 6);
            if (packs === 0) return intPart.toString();
            if (packs === 6) return (intPart + 1).toString();
            return intPart > 0 ? `${intPart} ${packs}/6` : `${packs}/6`;
        };

        // v66 價格遷移：在 Firestore 設定載入後自動修正價格
        // v67：鱈花枝自 2026/09/01 起工廠進價改為 130元/斤 (每箱30斤 = 3900)，出貨價維持 5700
        // v68：原味沙拉自 2026/10/01 起由 45 漲為 50 (進價、出貨價同步)
        const MIGRATION_VERSION = 'v68';
        const V66_PRICE_UPDATES = {
            'cut': { cost: 3750 },
            'cucumber': { cost: 400, price: 400 },
            'pepper': { cost: 460, price: 460 },
            'chili': { cost: 390, price: 390 },
            'boat_med': { name: '特中(餐盒)', cost: 105, price: 105 },
            'boat_large': { name: '特大(餐盒)', cost: 168, price: 168 },
            'bag': { cost: 29, price: 29 }
        };
        const V66_NEW_ITEM = { id: 'choco_rice', name: '巧克力米', category: '其他', cost: 175, price: 175, unit: '罐' };
        // 依序套用；已完成的版本不再重套，避免覆蓋之後在「設定」頁手動改過的價格
        const PRICE_MIGRATIONS = [
            { version: 'v66b', updates: V66_PRICE_UPDATES },
            { version: 'v67', updates: { 'cut': { cost: 3900 } } },
            { version: 'v68', updates: { 'salad_orig': { cost: 50, price: 50 } } }
        ];

        // 價格歷史：單據日期在 until(含) 之前時使用該筆舊價格；之後則用「設定」頁的目前價格
        // 之後再調價：在此加一筆「調價前一天」的舊價格，並到「設定」頁改成新價格即可
        const PRICE_HISTORY = {
            'cut': [{ until: '2026-08-31', cost: 3750 }],                // 鱈花枝 125元/斤 x 30斤；9/1 起 130元/斤 = 3900
            'salad_orig': [{ until: '2026-09-30', cost: 45, price: 45 }] // 原味沙拉；10/1 起 50
        };
        const getHistoricalValue = (item, date, field) => {
            if (!item) return 0;
            const history = PRICE_HISTORY[item.id];
            if (history && date) {
                const d = moment(date, ['YYYY-MM-DD', 'YYYY/MM/DD']);
                const hit = history.find(h => h[field] !== undefined && d.isSameOrBefore(moment(h.until, 'YYYY-MM-DD'), 'day'));
                if (hit) return hit[field];
            }
            return item[field] || 0;
        };
        const getCostOnDate = (item, date) => getHistoricalValue(item, date, 'cost');
        const getPriceOnDate = (item, date) => getHistoricalValue(item, date, 'price');

        // ---- 日期統一處理 ----
        const DATE_FORMATS = ['YYYY/MM/DD', 'YYYY-MM-DD', 'YYYY/M/D', 'YYYY-M-D'];
        // 表單日期轉存檔格式；日期欄空白或無效時改用今天（避免存成 "Invalid date" 而在報表中消失）
        const toRecordDate = (d) => { const m = moment(d, DATE_FORMATS, true); return (m.isValid() ? m : moment()).format('YYYY/MM/DD'); };
        // 單據日期；舊資料日期無效時改用建立時間 (id)，確保每一筆都進入報表與損益計算
        const txMoment = (t) => { const m = moment(t && t.date, DATE_FORMATS, true); return m.isValid() ? m : moment(Number(t && t.id) || undefined); };
        const hasValidDate = (t) => moment(t && t.date, DATE_FORMATS, true).isValid();

        const migrateSettingsV66 = async (settingsRef, currentData) => {
            if (currentData.migrationVersion === MIGRATION_VERSION) return currentData;

            const newItems = [...(currentData.items || [])];
            let changed = false;

            const doneIdx = PRICE_MIGRATIONS.findIndex(m => m.version === currentData.migrationVersion);
            const priceUpdates = PRICE_MIGRATIONS.slice(doneIdx + 1).reduce((acc, m) => {
                Object.entries(m.updates).forEach(([id, u]) => { acc[id] = { ...(acc[id] || {}), ...u }; });
                return acc;
            }, {});
            newItems.forEach((item, idx) => {
                const update = priceUpdates[item.id];
                if (update) {
                    Object.keys(update).forEach(key => {
                        if (newItems[idx][key] !== update[key]) {
                            newItems[idx] = { ...newItems[idx], ...update };
                            changed = true;
                        }
                    });
                }
            });

            if (!newItems.find(i => i.id === 'choco_rice')) {
                newItems.push(V66_NEW_ITEM);
                changed = true;
            }

            const newStarterPack = [...(currentData.starterPack || [])];
            newStarterPack.forEach((p, idx) => {
                if (p.id === 'boat_med' && p.name !== '特中(餐盒)') { newStarterPack[idx] = { ...p, name: '特中(餐盒)' }; changed = true; }
                if (p.id === 'boat_large' && p.name !== '特大(餐盒)') { newStarterPack[idx] = { ...p, name: '特大(餐盒)' }; changed = true; }
            });

            const newConstants = { ...currentData.constants };
            if (!newConstants.directFixedCosts) {
                newConstants.directFixedCosts = { salary: 50000, warehouseRent: 4000, boothRent: 16000 };
                changed = true;
            }
            if (!newConstants.companyFixedCosts) {
                newConstants.companyFixedCosts = { officeRent: 26000, ctbcLoan: 11708, chaileaseLoan: 38000 };
                changed = true;
            }

            if (changed) {
                const updatedData = { ...currentData, items: newItems, starterPack: newStarterPack, constants: newConstants, migrationVersion: MIGRATION_VERSION };
                await settingsRef.set(updatedData);
                console.log(`${MIGRATION_VERSION} 設定遷移完成`);
                return updatedData;
            }

            await settingsRef.update({ migrationVersion: MIGRATION_VERSION });
            return { ...currentData, migrationVersion: MIGRATION_VERSION };
        };

        const DEFAULT_SETTINGS = {
            items: [
                { id: 'cut', name: '花枝', category: '箱裝', cost: 3900, price: 5700, unit: '箱', isBox: true },
                { id: 'squid', name: '墨魚', category: '箱裝', cost: 2640, price: 4200, unit: '箱', isBox: true },
                { id: 'shrimp', name: '蝦球', category: '箱裝', cost: 4500, price: 6600, unit: '箱', isBox: true },
                { id: 'burdock', name: '牛蒡', category: '箱裝', cost: 2040, price: 3600, unit: '箱', isBox: true },
                { id: 'cucumber', name: '黃瓜碎', category: '其他', cost: 400, price: 400, unit: '包' },
                { id: 'pepper', name: '椒鹽粉(2斤)', category: '其他', cost: 460, price: 460, unit: '包' },
                { id: 'soul', name: '黯然銷魂粉(2斤)', category: '其他', cost: 600, price: 600, unit: '包' },
                { id: 'chili', name: '青花辣椒粉(1斤)', category: '其他', cost: 390, price: 390, unit: '包' },
                { id: 'salad_orig', name: '原味沙拉', category: '沙拉', cost: 50, price: 50, unit: '包' },
                { id: 'salad_mus', name: '芥末沙拉', category: '沙拉', cost: 60, price: 60, unit: '包' },
                { id: 'salad_honey', name: '蜂蜜沙拉', category: '沙拉', cost: 60, price: 60, unit: '包' },
                { id: 'boat_med', name: '特中(餐盒)', category: '包材', cost: 105, price: 105, unit: '條' },
                { id: 'boat_large', name: '特大(餐盒)', category: '包材', cost: 168, price: 168, unit: '條' },
                { id: 'bamboo', name: '竹籤', category: '包材', cost: 40, price: 40, unit: '包' },
                { id: 'fork', name: '叉匙', category: '包材', cost: 27, price: 27, unit: '包' },
                { id: 'bag', name: '提袋', category: '包材', cost: 29, price: 29, unit: '包' },
                { id: 'tray3', name: '3”船型', category: '包材', cost: 0.5, price: 0.5, unit: '個' },
                { id: 'tray4', name: '4”船型', category: '包材', cost: 0.6, price: 0.6, unit: '個' },
                { id: 'shrimp_chip', name: '蝦餅', category: '其他', cost: 60, price: 60, unit: '包' },
                { id: 'choco_rice', name: '巧克力米', category: '其他', cost: 175, price: 175, unit: '罐' },
                { id: 'glove', name: '手套', category: '其他', cost: 159, price: 159, unit: '盒' },
                { id: 'equip_set', name: '加盟器材套組', category: '器材', cost: 43200, price: 0, unit: '式' }
            ],
            starterPack: [
                { name: '加盟器材套組', qty: 1, unit: '式', type: 'equipment', id: 'equip_set' },
                { name: '黃瓜碎', qty: 3, unit: '包', type: 'dry', id: 'cucumber' },
                { name: '椒鹽粉(2斤)', qty: 1, unit: '包', type: 'dry', id: 'pepper' },
                { name: '黯然銷魂粉(2斤)', qty: 1, unit: '包', type: 'dry', id: 'soul' },
                { name: '青花辣椒粉(1斤)', qty: 1, unit: '包', type: 'dry', id: 'chili' },
                { name: '原味沙拉', qty: 12, unit: '包', type: 'dry', id: 'salad_orig' },
                { name: '芥末沙拉', qty: 10, unit: '包', type: 'dry', id: 'salad_mus' },
                { name: '蜂蜜沙拉', qty: 10, unit: '包', type: 'dry', id: 'salad_honey' },
                { name: '特中(餐盒)', qty: 3, unit: '條', type: 'dry', id: 'boat_med' },
                { name: '特大(餐盒)', qty: 1, unit: '條', type: 'dry', id: 'boat_large' },
                { name: '竹籤', qty: 5, unit: '包', type: 'dry', id: 'bamboo' },
                { name: '叉匙', qty: 10, unit: '包', type: 'dry', id: 'fork' },
                { name: '提袋', qty: 10, unit: '包', type: 'dry', id: 'bag' },
                { name: '3”船型', qty: 1000, unit: '個', type: 'dry', id: 'tray3' },
                { name: '4”船型', qty: 500, unit: '個', type: 'dry', id: 'tray4' },
                { name: '蝦餅', qty: 10, unit: '包', type: 'dry', id: 'shrimp_chip' },
                { name: '手套', qty: 1, unit: '盒', type: 'dry', id: 'glove' },
                { name: '花枝', qty: 3, unit: '箱', type: 'frozen', id: 'cut' },
                { name: '墨魚', qty: 1, unit: '箱', type: 'frozen', id: 'squid' },
                { name: '蝦球', qty: 1, unit: '箱', type: 'frozen', id: 'shrimp' },
                { name: '牛蒡', qty: 1, unit: '箱', type: 'frozen', id: 'burdock' }
            ],
            constants: {
                chaileaseBase: 240000,
                chaileaseFee: 13200,
                setupBudget: 50000,
                taxRate: 0.05,
                directFixedCosts: {
                    salary: 50000,
                    warehouseRent: 4000,
                    boothRent: 16000
                },
                companyFixedCosts: {
                    officeRent: 26000,
                    ctbcLoan: 11708,
                    chaileaseLoan: 38000
                }
            }
        };

        const generateFormattedReceipt = (title, date, items, itemMap, extraItems = [], shippingFee = 0) => {
            let text = `${title}\n日期：${date}\n------------------\n`;
            const frozen = items.filter(i => itemMap[i.id]?.isBox || i.type === 'frozen');
            const others = items.filter(i => !(itemMap[i.id]?.isBox || i.type === 'frozen'));

            if (frozen.length > 0) {
                text += `[箱裝]\n`;
                frozen.forEach(item => { text += `${item.name} x ${item.qty}${item.unit} = $${(item.price * item.qty).toLocaleString()}\n`; });
            }
            if (others.length > 0) {
                if (frozen.length > 0) text += `\n`;
                text += `[其他品項]\n`;
                others.forEach(item => { text += `${item.name} x ${item.qty}${item.unit} = $${(item.price * item.qty).toLocaleString()}\n`; });
            }
            if (shippingFee !== 0 || extraItems.length > 0) {
                text += `\n[其他費用]\n`;
                if(shippingFee !== 0) text += `運費: $${shippingFee}\n`;
                extraItems.forEach(item => { text += `${item.name}: $${item.amount}\n`; });
            }
            text += `------------------\n`;
            let grandTotal = 0;
            items.forEach(i => grandTotal += (i.price || 0) * i.qty);
            extraItems.forEach(e => grandTotal += Number(e.amount));
            grandTotal += Number(shippingFee);
            text += `總金額：$${grandTotal.toLocaleString()}`;
            return text;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [role, setRole] = useState(null);
            const [db, setDb] = useState(null);
            const [activeTab, setActiveTab] = useState('order'); 
            const [inventory, setInventory] = useState({});
            const [transactions, setTransactions] = useState([]);
            const [appSettings, setAppSettings] = useState(null);
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);
            useEffect(() => { if (!toast) return; const timer = setTimeout(() => setToast(null), 8000); return () => clearTimeout(timer); }, [toast]);

            useEffect(() => { if (firebase.apps.length) setDb(firebase.firestore()); }, []);

            useEffect(() => {
                const auth = firebase.auth();
                const unsub = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    if (u) {
                        setLoading(true);
                        const userRole = checkUserRole(u.email);
                        setRole(userRole);
                        if (userRole === ROLES.OPERATOR) setActiveTab('direct');

                        const sharedRef = firebase.firestore().collection('company_data').doc('main_system');
                        const unsubTrans = sharedRef.collection('transactions').orderBy('id', 'desc').onSnapshot({ includeMetadataChanges: true }, snap => {
                            const list = [];
                            // _pending：尚未得到雲端確認（離線或寫入中）
                            snap.forEach(doc => list.push({ ...doc.data(), _pending: !!(doc.metadata && doc.metadata.hasPendingWrites) }));
                            setTransactions(list);
                        });
                        const unsubInv = sharedRef.collection('data').doc('inventory').onSnapshot(doc => {
                            if (doc.exists) setInventory(doc.data());
                            else sharedRef.collection('data').doc('inventory').set(DEFAULT_SETTINGS.items.reduce((acc, i) => ({...acc, [i.id]: 0}), {}));
                        });
                        const settingsDocRef = sharedRef.collection('data').doc('settings');
                        const unsubSettings = settingsDocRef.onSnapshot(async (doc) => {
                            if (doc.exists) {
                                let data = doc.data();
                                if (data.migrationVersion !== MIGRATION_VERSION) {
                                    data = await migrateSettingsV66(settingsDocRef, data);
                                }
                                setAppSettings({ items: data.items || DEFAULT_SETTINGS.items, constants: { ...DEFAULT_SETTINGS.constants, ...(data.constants || {}) }, starterPack: data.starterPack || DEFAULT_SETTINGS.starterPack });
                            } else {
                                settingsDocRef.set({ ...DEFAULT_SETTINGS, migrationVersion: MIGRATION_VERSION });
                                setAppSettings(DEFAULT_SETTINGS);
                            }
                            setLoading(false);
                        });
                        return () => { unsubTrans(); unsubInv(); unsubSettings(); };
                    }
                });
                return () => unsub();
            }, []);

            const checkWritePermission = (actionType = 'general') => {
                if (role === ROLES.VIEWER) { alert('權限不足：您目前的帳號僅有「檢視」權限。'); return false; }
                if (role === ROLES.OPERATOR && actionType !== 'direct') { alert('權限不足：您的帳號僅能操作「直營」相關功能。'); return false; }
                return true;
            };

            const updateInventory = (id, change, isSet = false) => {
                if (!user || !db) return;
                if (!checkWritePermission()) return;
                const invRef = db.collection('company_data').doc('main_system').collection('data').doc('inventory');
                if (isSet) invRef.update({ [id]: change }).catch(() => invRef.set({ [id]: change }, { merge: true }));
                else invRef.update({ [id]: firebase.firestore.FieldValue.increment(change) }).catch(() => invRef.set({ [id]: change }, { merge: true }));
            };

            const addTransaction = (record) => {
                if (!user || !db) return;
                const actionType = record.type === '直營報表' ? 'direct' : 'general';
                if (!checkWritePermission(actionType)) return;
                record.createdBy = user.email;
                const label = `${record.type}${record.franchise && record.franchise !== '-' ? ' ' + record.franchise : ''} ${record.date}`;
                const outOfMonth = !moment(record.date, 'YYYY/MM/DD').isSame(moment(), 'month');
                const fail = (e) => { console.error(e); setToast(null); alert(`⚠️ 儲存失敗：「${label}」沒有寫入雲端，請重新登錄一次。\n原因：${e.message}`); };
                setToast({ ok: null, msg: `雲端儲存中：${label}…` });
                try {
                    db.collection('company_data').doc('main_system').collection('transactions').doc(String(record.id)).set(record)
                        .then(() => setToast({ ok: true, msg: `已存入雲端：${label}`, note: outOfMonth ? `此筆日期不在本月，總報表／進貨儀表板要把「區間」調到包含 ${record.date} 才看得到（或在總報表流水帳選「最近新增」）。` : '' }))
                        .catch(fail);
                } catch (e) { fail(e); }
            };

            const updateTransaction = (id, newFields) => {
                if (!user || !db) return;
                if (!checkWritePermission()) return;
                db.collection('company_data').doc('main_system').collection('transactions').doc(String(id)).update(newFields)
                    .catch(e => { console.error(e); alert('⚠️ 更新失敗，資料沒有寫入雲端，請再試一次。\n原因：' + e.message); });
            };

            const applyTransactionUpdates = async (updates) => {
                if (!user || !db) return false;
                if (!checkWritePermission()) return false;
                const col = db.collection('company_data').doc('main_system').collection('transactions');
                for (let i = 0; i < updates.length; i += 400) {
                    const batch = db.batch();
                    updates.slice(i, i + 400).forEach(u => batch.update(col.doc(String(u.id)), u.fields));
                    await batch.commit();
                }
                return true;
            };

            const deleteTransaction = async (id, type) => {
                if (!user || !db) return;
                const actionType = type === '直營報表' ? 'direct' : 'general';
                if (!checkWritePermission(actionType)) return;
                if (!confirm('確定要刪除此筆資料嗎？\n注意：這將會復原相關的庫存變動。')) return;
                setLoading(true);
                try {
                    const txRef = db.collection('company_data').doc('main_system').collection('transactions').doc(String(id));
                    const doc = await txRef.get();
                    if (!doc.exists) throw new Error('找不到該筆資料');
                    const tx = doc.data();
                    const batch = db.batch();
                    const invRef = db.collection('company_data').doc('main_system').collection('data').doc('inventory');
                    const invUpdates = {};

                    if ((tx.type === '出貨' || tx.type === '調撥' || tx.type === '直營報表') && tx.rawItems) {
                        tx.rawItems.forEach(item => { if (item.id) invUpdates[item.id] = firebase.firestore.FieldValue.increment(item.qty); });
                    } else if (tx.type === '進貨/支出' && tx.rawItems) {
                        tx.rawItems.forEach(item => { if (item.id) invUpdates[item.id] = firebase.firestore.FieldValue.increment(-item.qty); });
                    } else if (tx.type === '庫存校正' && tx.rawItems) {
                        tx.rawItems.forEach(item => { if (item.id) invUpdates[item.id] = firebase.firestore.FieldValue.increment(-item.change); });
                    } else if (tx.type === '加盟' && tx.franchiseData && tx.franchiseData.starterPack) {
                        tx.franchiseData.starterPack.forEach(item => { if(item.id !== 'equip_set') invUpdates[item.id] = firebase.firestore.FieldValue.increment(item.qty); });
                    }

                    if (Object.keys(invUpdates).length > 0) batch.update(invRef, invUpdates);
                    batch.delete(txRef);
                    await batch.commit();
                    alert('刪除成功，庫存已還原。');
                } catch (e) { console.error(e); alert('刪除失敗: ' + e.message); } finally { setLoading(false); }
            };

            const saveSettings = (newSettings) => {
                if (!user || !db) return;
                if (!checkWritePermission()) return;
                db.collection('company_data').doc('main_system').collection('data').doc('settings').set({ ...newSettings, migrationVersion: MIGRATION_VERSION }).then(() => alert('設定已儲存！')).catch(err => alert('儲存失敗: ' + err.message));
            };

            const uniqueFranchises = useMemo(() => {
                const set = new Set();
                transactions.forEach(t => { if(t.franchise && t.franchise !== '-') set.add(t.franchise); });
                return Array.from(set);
            }, [transactions]);

            const uniqueExpenseNames = useMemo(() => {
                const set = new Set();
                transactions.forEach(t => { if(t.type === '進貨/支出' && t.content) { const match = t.content.match(/【其他費用】\n(.*?):/); if(match && match[1]) set.add(match[1].trim()); } });
                return Array.from(set);
            }, [transactions]);

            if (!user) return <LoginScreen />;

            const ALL_TABS = [
                {id: 'order', label: '出貨/收款', icon: 'fa-truck'},
                {id: 'stockIn', label: '進貨管理', icon: 'fa-dolly'},
                {id: 'direct', label: '直營(湳雅)', icon: 'fa-store'},
                {id: 'franchise', label: '加盟', icon: 'fa-handshake'},
                {id: 'report', label: '總報表', icon: 'fa-chart-line'},
                {id: 'settings', label: '設定', icon: 'fa-cog'} 
            ];

            const visibleTabs = ALL_TABS.filter(tab => {
                if (role === ROLES.ADMIN) return true;
                if (role === ROLES.VIEWER) return tab.id !== 'settings';
                if (role === ROLES.OPERATOR) return tab.id === 'direct';
                return false;
            });

            return (
                <div className="min-h-screen max-w-5xl mx-auto bg-white shadow-xl flex flex-col">
                    <div className="bg-slate-800 text-white p-4 sticky top-0 z-50 shadow-md">
                        <div className="flex justify-between items-center mb-2">
                            <h1 className="text-lg font-bold"><i className="fa-solid fa-cloud mr-2 text-green-400"></i>加盟系統 Pro v70 <span className="text-xs bg-purple-500 px-1 rounded ml-1">多人協作版</span></h1>
                            <div className="flex items-center space-x-2">
                                <span className="text-xs text-slate-300 hidden md:inline">{user.email} ({role})</span>
                                <button onClick={() => firebase.auth().signOut()} className="text-xs bg-slate-700 px-2 py-1 rounded hover:bg-slate-600">登出</button>
                            </div>
                        </div>
                        <div className="flex space-x-1 overflow-x-auto no-scrollbar">
                            {visibleTabs.map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex-1 py-2 px-3 rounded-t-lg text-sm whitespace-nowrap transition ${activeTab === tab.id ? 'bg-white text-slate-800 font-bold' : 'text-slate-300 hover:bg-slate-700'}`}>
                                    <i className={`fa-solid ${tab.icon} mr-1`}></i>{tab.label}
                                </button>
                            ))}
                        </div>
                    </div>
                    
                    {toast && (
                        <div className={`fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] max-w-xl z-[70] p-3 rounded shadow-lg border text-sm flex justify-between gap-2 ${toast.ok === null ? 'bg-gray-100 text-gray-700' : 'bg-green-100 text-green-800'}`}>
                            <div><i className={`fa-solid ${toast.ok === null ? 'fa-spinner fa-spin' : 'fa-circle-check'} mr-2`}></i><span className="font-bold">{toast.msg}</span>{toast.note && <div className="text-xs text-orange-700 mt-1">{toast.note}</div>}</div>
                            <button onClick={() => setToast(null)} className="text-gray-400">✕</button>
                        </div>
                    )}
                    {role === ROLES.VIEWER && (
                        <div className="bg-yellow-100 text-yellow-800 p-2 text-center text-xs font-bold shadow-inner">目前為「純檢視模式」，無法新增或修改任何資料。</div>
                    )}

                    <div className="p-4 mb-20 flex-1 overflow-y-auto">
                        {(loading || !appSettings) && <div className="text-center py-10 text-gray-500"><i className="fa-solid fa-spinner fa-spin mr-2"></i>資料讀取中...</div>}
                        {!loading && appSettings && (
                            <div className="animate-fade-in">
                                {activeTab === 'order' && <OrderTab items={appSettings.items} inventory={inventory} onSubmit={addTransaction} onUpdateTrans={updateTransaction} transactions={transactions} onUpdateInv={updateInventory} franchises={uniqueFranchises} genReceipt={generateFormattedReceipt} role={role} />}
                                {activeTab === 'stockIn' && <StockInTab items={appSettings.items} inventory={inventory} onSubmit={addTransaction} onUpdateInv={updateInventory} expenseNames={uniqueExpenseNames} transactions={transactions} role={role} />}
                                {activeTab === 'direct' && <DirectStoreTab items={appSettings.items} inventory={inventory} onSubmit={addTransaction} onUpdateInv={updateInventory} transactions={transactions} onDelete={deleteTransaction} role={role} settings={appSettings} />}
                                {activeTab === 'franchise' && <FranchiseTab items={appSettings.items} inventory={inventory} onSubmit={addTransaction} onUpdateInv={updateInventory} onUpdateTrans={updateTransaction} onDelete={deleteTransaction} transactions={transactions} franchises={uniqueFranchises} settings={appSettings} genReceipt={generateFormattedReceipt} role={role} />}
                                {activeTab === 'report' && <ReportTab transactions={transactions} onDelete={deleteTransaction} items={appSettings.items} role={role} settings={appSettings} onApplyTransUpdates={applyTransactionUpdates} />}
                                {activeTab === 'settings' && <SettingsTab settings={appSettings} onSave={saveSettings} role={role} transactions={transactions} onApplyTransUpdates={applyTransactionUpdates} />}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const LoginScreen = () => {
            const [email, setEmail] = useState(''); const [pwd, setPwd] = useState(''); const [mode, setMode] = useState('login'); const [error, setError] = useState(''); const [loading, setLoading] = useState(false);
            
            const handleAuth = async (e) => { 
                e.preventDefault(); if(loading) return; setLoading(true); setError(''); 
                try { if (mode === 'login') await firebase.auth().signInWithEmailAndPassword(email, pwd); else await firebase.auth().createUserWithEmailAndPassword(email, pwd); } catch (e) { setError('登入失敗，請檢查帳號密碼'); setLoading(false); } 
            };

            const handleGoogleLogin = async () => {
                if(loading) return; setLoading(true); setError('');
                try { const provider = new firebase.auth.GoogleAuthProvider(); await firebase.auth().signInWithPopup(provider); } catch (e) { setError('Google 登入失敗: ' + e.message); setLoading(false); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                    <div className="bg-white p-6 rounded-lg shadow-lg max-w-sm w-full">
                        <h2 className="text-2xl font-bold mb-6 text-center text-slate-800">登入系統</h2>
                        <button onClick={handleGoogleLogin} disabled={loading} className="w-full bg-white border border-gray-300 text-gray-700 py-3 rounded font-bold mb-6 flex items-center justify-center hover:bg-gray-50 shadow-sm transition"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" className="w-5 h-5 mr-3"/>使用 Google 帳號登入</button>
                        <div className="flex items-center mb-6"><hr className="flex-1 border-gray-300"/><span className="px-3 text-xs text-gray-400 font-bold">或使用 Email</span><hr className="flex-1 border-gray-300"/></div>
                        <div className="flex bg-gray-200 rounded p-1 mb-4"><button type="button" onClick={()=>setMode('login')} className={`flex-1 py-1 rounded text-sm ${mode==='login'?'bg-white shadow font-bold':''}`}>登入</button><button type="button" onClick={()=>setMode('register')} className={`flex-1 py-1 rounded text-sm ${mode==='register'?'bg-white shadow font-bold':''}`}>註冊</button></div>
                        <form onSubmit={handleAuth}>
                            <input type="email" placeholder="Email" className="w-full border p-3 rounded mb-3" value={email} onChange={e=>setEmail(e.target.value)} required/>
                            <input type="password" placeholder="密碼" className="w-full border p-3 rounded mb-4" value={pwd} onChange={e=>setPwd(e.target.value)} required/>
                            {error && <div className="text-red-500 text-xs mb-4">{error}</div>}
                            <button type="submit" disabled={loading} className="w-full bg-indigo-600 text-white py-3 rounded font-bold mb-4">{loading?'處理中...':(mode==='login'?'確認 Email 登入':'確認註冊')}</button>
                        </form>
                    </div>
                </div>
            );
        };

        const DirectStoreTab = ({ items, inventory, onSubmit, onUpdateInv, transactions, onDelete, role, settings }) => {
            const isReadonly = role === ROLES.VIEWER;
            const [view, setView] = useState('manual'); 
            const [selectedMonth, setSelectedMonth] = useState(moment().format('YYYY-MM'));
            const [expandedDate, setExpandedDate] = useState(null);
            
            const [manualDate, setManualDate] = useState(moment().format('YYYY-MM-DD'));
            const [manualIncome, setManualIncome] = useState('');
            const [manualExpense, setManualExpense] = useState('');
            const [manualNote, setManualNote] = useState('');
            const [manualCart, setManualCart] = useState({});

            const nanyaTrans = useMemo(() => {
                return transactions.filter(t => t.franchise === '湳雅直營店' && t.type === '直營報表').sort((a,b) => b.id - a.id);
            }, [transactions]);

            const monthStats = useMemo(() => {
                const start = moment(selectedMonth).startOf('month');
                const end = moment(selectedMonth).endOf('month');
                const filtered = nanyaTrans.filter(t => txMoment(t).isBetween(start, end, 'day', '[]'));
                const dailyGroups = {};
                let totalRev = 0;
                
                filtered.forEach(t => {
                    if (!dailyGroups[t.date]) dailyGroups[t.date] = { rev: 0, cost: 0, exp: 0, items: [] };
                    const exp = t.rawExpenses || 0;
                    const cogs = (t.cost - exp);
                    dailyGroups[t.date].rev += t.income;
                    dailyGroups[t.date].exp += exp;
                    dailyGroups[t.date].cost += cogs;
                    dailyGroups[t.date].items.push(t);
                    totalRev += t.income;
                });
                Object.keys(dailyGroups).forEach(d => { dailyGroups[d].net = dailyGroups[d].rev - (dailyGroups[d].exp + dailyGroups[d].cost); });
                return { dailyGroups, list: filtered, totalRev };
            }, [nanyaTrans, selectedMonth]);

            const handleManualCartChange = (id, val) => {
                const newQty = parseFloat(val);
                if (isNaN(newQty) || newQty < 0) { const { [id]: _, ...rest } = manualCart; setManualCart(rest); } else { setManualCart({ ...manualCart, [id]: newQty }); }
            };

            const submitManualReport = () => {
                if (isReadonly) return;
                if (!manualDate || !manualIncome) return alert('請輸入日期與業績');
                const income = parseInt(manualIncome);
                const expense = parseInt(manualExpense) || 0;
                const itemsList = [];
                Object.entries(manualCart).forEach(([id, qty]) => {
                    const item = items.find(i => i.id === id);
                    if (item && qty > 0) {
                        let finalQty = qty; let unit = item.unit;
                        if (item.isBox) { finalQty = qty / 6; unit = "包(已轉箱)"; }
                        itemsList.push({ ...item, qty: finalQty, displayUnit: unit, inputQty: qty });
                    }
                });
                const duplicate = transactions.find(t => t.franchise === '湳雅直營店' && t.date === manualDate && t.type === '直營報表');
                if (duplicate) { if (!confirm(`警告：${manualDate} 已經有一筆報表紀錄，是否要建立新的一筆？`)) return; }
                processSubmission(manualDate, income, expense, manualNote, itemsList);
                setManualIncome(''); setManualExpense(''); setManualNote(''); setManualCart({});
            };

            const processSubmission = (pDate, pIncome, pExpense, pNote, pItems) => {
                pItems = pItems.map(item => ({ ...item, cost: getCostOnDate(item, pDate) }));
                const totalCostOfGoods = pItems.reduce((sum, item) => sum + (item.cost * item.qty), 0);
                const totalCost = totalCostOfGoods + pExpense;
                const profit = pIncome - totalCost;
                let content = `【直營日報】\n日期：${pDate}\n業績：$${pIncome.toLocaleString()}\n`;
                if (pExpense > 0) content += `支出：$${pExpense.toLocaleString()} (${pNote || '雜支'})\n`;
                content += `------------------\n[消耗品項]\n`;
                pItems.forEach(i => {
                    const displayQty = i.inputQty ? i.inputQty : i.qty;
                    const displayUnit = i.displayUnit || i.unit;
                    content += `${i.name}: ${displayQty}${displayUnit} (成本$${(i.cost * i.qty).toFixed(0)})\n`;
                });
                content += `------------------\n淨利：$${profit.toLocaleString()}`;
                const record = { id: Date.now(), date: pDate, time: moment().format('A h:mm'), type: '直營報表', franchise: '湳雅直營店', content: content, rawItems: pItems.map(i => ({...i, id: i.id, qty: i.qty})), shipping: 0, income: pIncome, rawExpenses: pExpense, expenseDetail: pNote, cost: totalCost, profit: profit, total: pIncome };
                onSubmit(record);
                pItems.forEach(item => onUpdateInv(item.id, -item.qty));

                alert('日報表已建立，庫存已扣除');
            };

            const toggleExpand = (date) => setExpandedDate(expandedDate === date ? null : date);

            const renderCalendar = () => {
                const startOfMonth = moment(selectedMonth).startOf('month');
                const daysInMonth = startOfMonth.daysInMonth();
                const firstDayOfWeek = startOfMonth.day(); 

                const blanks = Array.from({ length: firstDayOfWeek }).map((_, i) => <div key={`blank-${i}`} className="bg-gray-50 h-16 md:h-24"></div>);
                
                const days = Array.from({ length: daysInMonth }).map((_, i) => {
                    const d = i + 1;
                    const dateStr = `${selectedMonth}-${d.toString().padStart(2, '0')}`;
                    const stat = monthStats.dailyGroups[dateStr];
                    const isExpanded = expandedDate === dateStr;
                    
                    return (
                        <div key={d} onClick={() => stat ? toggleExpand(dateStr) : null} className={`relative flex flex-col h-16 md:h-24 ${stat ? 'cursor-pointer hover:bg-blue-50 bg-white' : 'bg-gray-50'} ${isExpanded ? 'ring-2 ring-blue-400 z-10 shadow-lg' : ''}`}>
                            <div className="absolute top-1 left-1 md:top-2 md:left-2 text-[10px] md:text-xs text-gray-500 font-bold">{d}</div>
                            <div className="flex-1 flex flex-col items-center justify-center pt-3 md:pt-4">
                                {stat ? (
                                    <>
                                        <div className={`text-sm md:text-2xl font-bold leading-none ${stat.rev > 0 ? 'text-green-600' : 'text-gray-400'}`}>
                                            {stat.rev > 0 ? stat.rev.toLocaleString() : '-'}
                                        </div>
                                        <div className="text-[8px] md:text-[10px] text-gray-400 mt-1 md:mt-2">({stat.items.length}筆)</div>
                                    </>
                                ) : null}
                            </div>
                        </div>
                    );
                });

                return (
                    <div className="bg-white p-2 shadow rounded border border-gray-200">
                        <div className="grid grid-cols-7 gap-px bg-gray-200 rounded overflow-hidden">
                            {['日', '一', '二', '三', '四', '五', '六'].map(d => (
                                <div key={d} className="bg-gray-100 text-center text-xs md:text-sm font-bold py-1.5 text-gray-600">{d}</div>
                            ))}
                            {blanks}
                            {days}
                        </div>
                    </div>
                );
            };

            return (
                <div className="space-y-4">
                    <div className="flex bg-gray-200 p-1 rounded">
                        <button onClick={()=>setView('manual')} className={`flex-1 py-2 rounded text-sm font-bold ${view==='manual'?'bg-white shadow text-purple-600':''}`}>手動輸入</button>
                        <button onClick={()=>setView('history')} className={`flex-1 py-2 rounded text-sm font-bold ${view==='history'?'bg-white shadow text-green-600':''}`}>當月營運日曆</button>
                    </div>
                    {view === 'manual' && (
                        <div className={`bg-white p-4 shadow rounded space-y-4 animate-fade-in ${isReadonly ? 'readonly-mode' : ''}`}>
                            <h3 className="font-bold border-b pb-2">手動補登日報</h3>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-xs font-bold text-gray-500">日期</label><input type="date" value={manualDate} onChange={e=>setManualDate(e.target.value)} className="w-full border p-2 rounded"/></div>
                                <div><label className="block text-xs font-bold text-gray-500">當日業績</label><input type="number" value={manualIncome} onChange={e=>setManualIncome(e.target.value)} className="w-full border p-2 rounded font-bold text-green-700" placeholder="$"/></div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-xs font-bold text-gray-500">費用總額</label><input type="number" value={manualExpense} onChange={e=>setManualExpense(e.target.value)} className="w-full border p-2 rounded text-red-600" placeholder="$"/></div>
                                <div><label className="block text-xs font-bold text-gray-500">費用細項 (備註)</label><input type="text" value={manualNote} onChange={e=>setManualNote(e.target.value)} className="w-full border p-2 rounded" placeholder="如: 瓦斯, 買菜"/></div>
                            </div>
                            <div className="border-t pt-2">
                                <label className="block text-xs font-bold text-gray-500 mb-2">消耗品項 (冷凍品請輸入"包"數)</label>
                                <div className="grid grid-cols-2 gap-2 h-60 overflow-y-auto border p-2 rounded bg-gray-50">
                                    {items.map(item => (
                                        <div key={item.id} className="flex justify-between items-center bg-white p-2 rounded border shadow-sm">
                                            <span className="text-sm">{item.name}</span>
                                            <div className="flex items-center space-x-1">
                                                <input type="number" value={manualCart[item.id] || ''} onChange={e=>handleManualCartChange(item.id, e.target.value)} className="w-12 border text-center text-sm p-1 rounded" placeholder="0"/>
                                                <span className="text-xs text-gray-400">{item.isBox ? '包' : item.unit}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            {!isReadonly && <button onClick={submitManualReport} className="w-full bg-purple-600 text-white py-3 rounded font-bold hover:bg-purple-700">建立日報表</button>}
                        </div>
                    )}
                    {view === 'history' && (
                        <div className="space-y-4 animate-fade-in">
                            <div className="bg-white p-2 md:p-4 shadow rounded flex items-center justify-between">
                                <span className="font-bold text-gray-700">月份選擇</span>
                                <input type="month" value={selectedMonth} onChange={e=>setSelectedMonth(e.target.value)} className="border p-2 rounded font-bold text-gray-700"/>
                            </div>
                            
                            {(() => {
                                const dfc = settings?.constants?.directFixedCosts || {};
                                const totalFixed = (dfc.salary || 0) + (dfc.warehouseRent || 0) + (dfc.boothRent || 0);
                                const daysWorked = Object.keys(monthStats.dailyGroups).length;
                                const dailyAvg = daysWorked > 0 ? Math.round(monthStats.totalRev / daysWorked) : 0;
                                return (
                                    <div className="bg-white p-3 md:p-4 rounded shadow-sm border space-y-2">
                                        <div className="text-center font-bold text-gray-700 text-sm md:text-base flex flex-col md:flex-row justify-center items-center gap-2 md:gap-4">
                                            <span>當月總營收: <span className="text-blue-600 text-lg md:text-xl">${monthStats.totalRev.toLocaleString()}</span></span>
                                            <span className="hidden md:inline text-gray-300">|</span>
                                            <span>平均業績 (共{daysWorked}天): <span className="text-green-600 text-lg md:text-xl">${dailyAvg.toLocaleString()}</span></span>
                                        </div>
                                        <div className="border-t pt-2 grid grid-cols-2 md:grid-cols-4 gap-2 text-xs text-gray-500">
                                            <div className="bg-red-50 p-2 rounded text-center"><div className="font-bold text-gray-600">人員薪資</div><div className="text-red-600 font-bold">${(dfc.salary||0).toLocaleString()}</div></div>
                                            <div className="bg-red-50 p-2 rounded text-center"><div className="font-bold text-gray-600">倉庫租金</div><div className="text-red-600 font-bold">${(dfc.warehouseRent||0).toLocaleString()}</div></div>
                                            <div className="bg-red-50 p-2 rounded text-center"><div className="font-bold text-gray-600">攤位租金</div><div className="text-red-600 font-bold">${(dfc.boothRent||0).toLocaleString()}</div></div>
                                            <div className="bg-orange-50 p-2 rounded text-center"><div className="font-bold text-gray-600">固定成本合計</div><div className="text-orange-600 font-bold text-sm">${totalFixed.toLocaleString()}</div></div>
                                        </div>
                                        <div className="text-center text-sm font-bold">
                                            扣除固定成本後淨利: <span className={`text-base ${(monthStats.totalRev - totalFixed) >= 0 ? 'text-green-600' : 'text-red-600'}`}>${(monthStats.totalRev - totalFixed).toLocaleString()}</span>
                                        </div>
                                    </div>
                                );
                            })()}

                            {renderCalendar()}

                            <div className="bg-white shadow rounded overflow-hidden">
                                <div className="bg-gray-100 p-2 font-bold text-xs text-gray-500">歷史紀錄清單 (本月倒序)</div>
                                <div className="max-h-80 overflow-y-auto p-2 custom-scrollbar">
                                    {Object.entries(monthStats.dailyGroups).sort((a,b) => b[0].localeCompare(a[0])).map(([date, group]) => (
                                        <div key={date} className={`border rounded mb-2 overflow-hidden shadow-sm transition-all ${expandedDate === date ? 'border-blue-400 ring-1 ring-blue-400' : ''}`}>
                                             <div className="bg-gray-50 hover:bg-gray-100 p-3 flex justify-between items-center cursor-pointer select-none" onClick={()=>toggleExpand(date)}>
                                                 <div className="flex items-center space-x-2">
                                                     <i className={`fa-solid ${expandedDate === date ? 'fa-chevron-down' : 'fa-chevron-right'} text-gray-400 text-xs w-4`}></i>
                                                     <span className="font-bold text-gray-700">{date}</span>
                                                     <span className="text-xs bg-gray-200 text-gray-600 px-1.5 rounded-full">{group.items.length}筆</span>
                                                 </div>
                                                 <div className="text-right">
                                                     <span className={`font-mono font-bold block text-sm ${group.net >= 0 ? 'text-blue-600' : 'text-red-600'}`}>${group.net.toLocaleString()}</span>
                                                     <span className="text-[10px] text-gray-400 block">支:${group.exp.toLocaleString()}</span>
                                                 </div>
                                             </div>
                                             {expandedDate === date && (
                                                <div className="bg-white border-t">
                                                    {group.items.map(t => (
                                                        <div key={t.id} className="flex justify-between items-center p-3 border-b last:border-0 hover:bg-gray-50">
                                                            <div className="flex-1">
                                                                <div className="text-sm text-gray-700 font-medium whitespace-pre-wrap">{t.content.split('\n')[2] || t.content}</div> 
                                                            </div>
                                                            <div className="text-right px-4">
                                                                <div className="text-green-600 font-bold text-sm">+${t.income.toLocaleString()}</div>
                                                                <div className="text-red-400 text-xs">-${(t.cost - (t.rawExpenses||0)).toLocaleString()}(材)</div>
                                                            </div>
                                                            {!isReadonly && <button onClick={() => onDelete(t.id, t.type)} className="text-gray-300 hover:text-red-500 p-2"><i className="fa-solid fa-trash-can"></i></button>}
                                                        </div>
                                                    ))}
                                                </div>
                                             )}
                                        </div>
                                    ))}
                                    {monthStats.list.length === 0 && <div className="p-4 text-center text-gray-400 text-sm">本月尚無資料</div>}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const OrderTab = ({ items, inventory, onSubmit, onUpdateTrans, transactions, onUpdateInv, franchises, genReceipt, role }) => {
            const isReadonly = role === ROLES.VIEWER;
            const [subView, setSubView] = useState('order'); // 'order' or 'ar'
            
            // 出貨狀態
            const [cart, setCart] = useState({}); 
            const [franchiseName, setFranchiseName] = useState(''); 
            const [orderDate, setOrderDate] = useState(moment().format('YYYY-MM-DD')); 
            const [isTransfer, setIsTransfer] = useState(false); 
            const [shippingFee, setShippingFee] = useState(0);
            const [isShippingManual, setIsShippingManual] = useState(false);
            const [extraItems, setExtraItems] = useState([]);
            const [tempItemName, setTempItemName] = useState('');
            const [tempItemAmount, setTempItemAmount] = useState('');

            // AR 狀態
            const [arTarget, setArTarget] = useState('');
            const [arItem, setArItem] = useState('');
            const [arAmount, setArAmount] = useState('');
            const [arDate, setArDate] = useState(moment().format('YYYY-MM-DD'));
            
            const [payInputId, setPayInputId] = useState(null);
            const [payAmount, setPayAmount] = useState('');
            const [payDate, setPayDate] = useState(moment().format('YYYY-MM-DD'));

            const handleQtyChange = (id, val) => { const newQty = parseInt(val) || 0; setCart(prev => { if (newQty <= 0) { const { [id]: _, ...rest } = prev; return rest; } return { ...prev, [id]: newQty }; }); };
            
            useEffect(() => {
                if (!isShippingManual) {
                    let boxCount = 0;
                    items.forEach(item => { if (item.isBox && cart[item.id]) boxCount += cart[item.id]; });
                    setShippingFee(boxCount * 120);
                }
            }, [cart, items, isShippingManual]);

            const handleShippingChange = (e) => { setShippingFee(e.target.value); setIsShippingManual(true); };
            const resetShipping = () => { setIsShippingManual(false); let boxCount = 0; items.forEach(item => { if (item.isBox && cart[item.id]) boxCount += cart[item.id]; }); setShippingFee(boxCount * 120); };
            const addExtraItem = () => { if(!tempItemName || !tempItemAmount) return; setExtraItems([...extraItems, { id: Date.now(), name: tempItemName, amount: Number(tempItemAmount) }]); setTempItemName(''); setTempItemAmount(''); };
            const removeExtraItem = (id) => { setExtraItems(extraItems.filter(i => i.id !== id)); };

            const prepareOrderData = () => {
                let productTotal = 0; let itemDetails = [];
                Object.entries(cart).forEach(([id, qty]) => { 
                    const item = items.find(i => i.id === id); 
                    if(item) { const unitPrice = isTransfer ? 0 : getPriceOnDate(item, orderDate); productTotal += unitPrice * qty; itemDetails.push({...item, qty, price: unitPrice, cost: getCostOnDate(item, orderDate)}); } 
                });
                return { itemDetails, productTotal };
            };

            const copyToClipboard = () => { 
                const { itemDetails } = prepareOrderData(); 
                const title = isTransfer ? `【調撥單】_${franchiseName || '未填寫'}` : `【訂貨單】_${franchiseName || '未填寫'}`;
                const text = genReceipt(title, toRecordDate(orderDate), itemDetails, items.reduce((map, i) => ({...map, [i.id]: i}), {}), extraItems, Number(shippingFee));
                const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');alert('已複製\n'+text);}catch(e){alert('複製失敗');} document.body.removeChild(ta); 
            };

            const handleSubmit = () => { 
                if (isReadonly) return;
                if (!franchiseName) return alert('請輸入對象(加盟點/單位)'); 
                if (Object.keys(cart).length === 0) return alert('購物車是空的'); 
                
                const { itemDetails, productTotal } = prepareOrderData();
                const finalShipping = Number(shippingFee);
                const extrasTotal = extraItems.reduce((a,b) => a + b.amount, 0);
                const totalAmount = isTransfer ? 0 : (productTotal + extrasTotal + finalShipping);
                
                let productCost = 0;
                itemDetails.forEach(item => { 
                    const originalItem = items.find(i => i.id === item.id);
                    productCost += getCostOnDate(originalItem, orderDate) * item.qty; 
                    onUpdateInv(item.id, -item.qty); 
                });
                
                const title = isTransfer ? `【調撥單】_${franchiseName}` : `【訂貨單】_${franchiseName}`;
                const detailsText = genReceipt(title, toRecordDate(orderDate), itemDetails, items.reduce((map, i) => ({...map, [i.id]: i}), {}), extraItems, finalShipping);
                
                const record = { 
                    id: Date.now(), date: toRecordDate(orderDate), time: moment().format('A h:mm'), 
                    type: isTransfer ? '調撥' : '出貨', franchise: franchiseName, content: detailsText.trim(), 
                    rawItems: itemDetails, shipping: finalShipping, otherFee: extrasTotal, 
                    income: totalAmount, cost: productCost + finalShipping, profit: totalAmount - (productCost + finalShipping), 
                    total: totalAmount,
                    payments: [] // 新增 payments 陣列用作應收款追蹤
                }; 
                onSubmit(record); 
                alert(isTransfer ? '調撥單已建立' : '出貨單已建立'); 
                setCart({}); setFranchiseName(''); setExtraItems([]); setIsTransfer(false); setShippingFee(0); setIsShippingManual(false);
            };

            // ---- 應收帳款邏輯 ----
            const arList = useMemo(() => {
                return transactions
                    .filter(t => ((t.type === '出貨' && t.total > 0) || t.type === '應收帳款'))
                    .map(t => {
                        const paid = (t.payments || []).reduce((sum, p) => sum + p.amount, 0);
                        const remain = t.total - paid;
                        const days = moment().diff(txMoment(t), 'days');
                        return { ...t, paid, remain, days };
                    })
                    .sort((a, b) => {
                        const aUnpaid = a.remain !== 0;
                        const bUnpaid = b.remain !== 0;
                        if (aUnpaid && !bUnpaid) return -1;
                        if (!aUnpaid && bUnpaid) return 1;
                        return b.id - a.id;
                    });
            }, [transactions]);

            const handleAddAr = () => {
                if (isReadonly) return;
                if (!arTarget || !arItem || !arAmount) return alert('請填寫完整資訊');
                
                const record = {
                    id: Date.now(), date: toRecordDate(arDate), time: moment().format('A h:mm'),
                    type: '應收帳款', franchise: arTarget, content: arItem,
                    total: Number(arAmount), income: Number(arAmount), cost: 0, profit: Number(arAmount),
                    payments: [], shipping: 0, rawItems: []
                };
                onSubmit(record);
                alert('已新增手動應收帳款');
                setArTarget(''); setArItem(''); setArAmount('');
            };

            const handleFullPay = (t) => {
                if (isReadonly) return;
                if (!confirm(`確定將 ${t.franchise} 的剩餘欠款 $${t.remain.toLocaleString()} 設為已結清？`)) return;
                const newPayment = { date: moment().format('YYYY-MM-DD'), amount: t.remain };
                onUpdateTrans(t.id, { payments: [...(t.payments || []), newPayment] });
                alert('已全數結清！');
            };

            const confirmPartialPay = (t) => {
                if (isReadonly) return;
                const amt = Number(payAmount);
                if (!amt || amt === 0) return alert('請輸入有效金額');
                if (amt > t.remain && t.remain > 0) return alert('還款金額不能大於剩餘欠款'); 
                const newPayment = { date: payDate, amount: amt };
                onUpdateTrans(t.id, { payments: [...(t.payments || []), newPayment] });
                setPayInputId(null);
                alert('已記錄收回款項！');
            };

            return (
                <div className="space-y-4">
                    <datalist id="franchise-list-order">{franchises.filter(f => f !== '湳雅直營店').map(f=><option key={f} value={f}/>)}</datalist>
                    
                    <div className="flex bg-gray-200 p-1 rounded">
                        <button onClick={()=>setSubView('order')} className={`flex-1 py-2 rounded text-sm font-bold ${subView==='order'?'bg-white shadow text-blue-600':''}`}>新增出貨/調撥</button>
                        <button onClick={()=>setSubView('ar')} className={`flex-1 py-2 rounded text-sm font-bold ${subView==='ar'?'bg-white shadow text-indigo-600':''}`}>應收貨款追蹤</button>
                    </div>

                    {subView === 'order' && (
                        <div className="animate-fade-in space-y-4">
                            <div className={`bg-white p-4 rounded-lg shadow border ${isReadonly ? 'readonly-mode' : ''}`}>
                                <div className="flex justify-between items-center mb-4 border-b pb-2">
                                     <div className="font-bold text-gray-700">出貨 / 調撥資訊</div>
                                     <label className={`flex items-center space-x-2 px-3 py-1 rounded cursor-pointer select-none border ${isTransfer ? 'bg-orange-100 border-orange-500 text-orange-700' : 'bg-gray-100 text-gray-500'}`}>
                                         <input type="checkbox" checked={isTransfer} onChange={e=>setIsTransfer(e.target.checked)} className="form-checkbox"/>
                                         <span className="font-bold text-sm">調撥 (不計營收)</span>
                                     </label>
                                </div>
                                <div className="grid grid-cols-2 gap-4 mb-4">
                                    <div><label className="block text-sm text-gray-700">日期</label><input type="date" value={orderDate} onChange={e=>setOrderDate(e.target.value)} className="w-full border rounded p-2"/></div>
                                    <div><label className="block text-sm text-gray-700">對象</label><input type="text" list="franchise-list-order" value={franchiseName} onChange={e=>setFranchiseName(e.target.value)} className="w-full border rounded p-2" placeholder="請輸入或選擇"/></div>
                                </div>
                                <div className="bg-blue-50 p-3 rounded border border-blue-100 mb-2">
                                    <div className="flex justify-between items-center mb-1">
                                        <label className="text-xs font-bold text-blue-700">運費設定 (預設 $120/箱)</label>
                                        {isShippingManual && <button onClick={resetShipping} className="text-xs text-gray-500 underline">重置自動計算</button>}
                                    </div>
                                    <input type="number" value={shippingFee} onChange={handleShippingChange} className={`w-full border p-2 rounded ${isShippingManual ? 'bg-yellow-50 font-bold border-yellow-300' : 'bg-white'}`} placeholder="輸入運費"/>
                                </div>
                                <div className="bg-gray-50 p-3 rounded border">
                                    <div className="flex gap-2 mb-2">
                                        <input type="text" placeholder="項目名稱" value={tempItemName} onChange={e=>setTempItemName(e.target.value)} className="border p-2 flex-1 rounded text-sm"/>
                                        <input type="number" placeholder="$" value={tempItemAmount} onChange={e=>setTempItemAmount(e.target.value)} className="border p-2 w-20 rounded text-sm"/>
                                        <button onClick={addExtraItem} className="bg-blue-500 text-white px-3 rounded font-bold text-sm">+</button>
                                    </div>
                                    <div className="space-y-1">
                                        {extraItems.map(item => (
                                            <div key={item.id} className="flex justify-between text-sm bg-white p-1 px-2 border rounded">
                                                <span>{item.name}</span>
                                                <span className="flex items-center gap-2">${item.amount} <i className="fa-solid fa-times text-red-400 cursor-pointer" onClick={()=>removeExtraItem(item.id)}></i></span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div className={`grid grid-cols-2 gap-3 ${isReadonly ? 'readonly-mode' : ''}`}>
                                {items.map(item=>(
                                    <div key={item.id} className={`bg-white p-3 shadow-sm border flex justify-between ${isTransfer ? 'border-orange-200':''}`}>
                                        <div><div className="font-bold">{item.name}</div><div className="text-xs text-gray-500">${getPriceOnDate(item, orderDate)}</div></div>
                                        <div className="flex items-center space-x-2">
                                            <button onClick={()=>handleQtyChange(item.id, (cart[item.id]||0)-1)} className="w-8 border">-</button>
                                            <input type="number" value={cart[item.id]||''} onChange={e=>handleQtyChange(item.id, e.target.value)} className="w-10 text-center border"/>
                                            <button onClick={()=>handleQtyChange(item.id, (cart[item.id]||0)+1)} className="w-8 border">+</button>
                                        </div>
                                        <div className={`text-[10px] mt-1 text-right ${inventory[item.id] < 1 ? 'text-red-500' : 'text-gray-500'}`}>存: {item.isBox ? formatBoxQty(inventory[item.id]) : (inventory[item.id] || 0)}</div>
                                    </div>
                                ))}
                            </div>
                            <div className="sticky bottom-4 bg-slate-800 text-white p-4 rounded-lg flex justify-between shadow-xl">
                                <div className="font-bold">總計: ${isTransfer ? (prepareOrderData().itemDetails.reduce((a,b)=>a+(getCostOnDate(items.find(i=>i.id===b.id), orderDate)*b.qty),0) + Number(shippingFee)).toLocaleString() : (prepareOrderData().productTotal + extraItems.reduce((a,b)=>a+b.amount,0) + Number(shippingFee)).toLocaleString()}</div>
                                <div className="space-x-3 flex">
                                    <button onClick={copyToClipboard} className="bg-green-600 px-3 py-2 rounded text-sm flex items-center"><i className="fa-regular fa-copy mr-1"></i> 複製</button>
                                    {!isReadonly && <button onClick={handleSubmit} className={`${isTransfer?'bg-orange-500':'bg-blue-500'} px-4 py-2 rounded font-bold text-sm`}>{isTransfer ? '確認調撥' : '確認出貨'}</button>}
                                </div>
                            </div>
                        </div>
                    )}

                    {subView === 'ar' && (
                        <div className="animate-fade-in space-y-4">
                            <div className={`bg-white p-4 rounded-lg shadow border border-indigo-100 ${isReadonly ? 'readonly-mode' : ''}`}>
                                <h3 className="font-bold text-indigo-800 mb-3 border-b pb-2">手動輸入應收帳款</h3>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
                                    <div><label className="text-xs text-gray-500 font-bold block mb-1">日期</label><input type="date" value={arDate} onChange={e=>setArDate(e.target.value)} className="w-full border p-2 rounded text-sm"/></div>
                                    <div><label className="text-xs text-gray-500 font-bold block mb-1">應收帳款人</label><input type="text" list="franchise-list-order" value={arTarget} onChange={e=>setArTarget(e.target.value)} placeholder="如: 加盟店A" className="w-full border p-2 rounded text-sm"/></div>
                                    <div><label className="text-xs text-gray-500 font-bold block mb-1">項目</label><input type="text" value={arItem} onChange={e=>setArItem(e.target.value)} placeholder="如: 貨款、運費" className="w-full border p-2 rounded text-sm"/></div>
                                    <div><label className="text-xs text-gray-500 font-bold block mb-1">款項 (可負數)</label><input type="number" value={arAmount} onChange={e=>setArAmount(e.target.value)} placeholder="$" className="w-full border p-2 rounded text-sm font-bold"/></div>
                                </div>
                                {!isReadonly && <button onClick={handleAddAr} className="w-full bg-indigo-600 hover:bg-indigo-700 transition text-white font-bold py-2.5 rounded shadow">新增應收款</button>}
                            </div>

                            <div className="bg-white rounded-lg shadow overflow-hidden border">
                                <div className="bg-gray-100 p-3 font-bold text-gray-700 flex justify-between items-center border-b">
                                    <span>未結清與歷史應收列表</span>
                                    <span className="text-xs font-bold bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full border border-indigo-200">總未收: ${arList.filter(t=>t.remain!==0).reduce((s,t)=>s+t.remain,0).toLocaleString()}</span>
                                </div>
                                <div className="divide-y max-h-[60vh] overflow-y-auto">
                                    {arList.map(t => (
                                        <div key={t.id} className={`p-4 ${t.remain === 0 ? 'bg-gray-50 opacity-70' : 'bg-white hover:bg-slate-50'}`}>
                                            <div className="flex justify-between items-start mb-2">
                                                <div className="font-bold text-sm md:text-base flex items-center flex-wrap gap-2">
                                                    <span className={`px-2 py-0.5 rounded text-white text-[10px] md:text-xs ${t.type === '出貨' ? 'bg-blue-500' : 'bg-purple-500'}`}>{t.type}</span>
                                                    <span>{t.franchise}</span>
                                                    <span className="text-gray-400 text-xs font-normal">({t.date})</span>
                                                    {t.remain !== 0 && <span className="text-red-600 text-xs font-bold bg-red-100 border border-red-200 px-1.5 py-0.5 rounded-full">{t.days}天未清</span>}
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-sm font-bold text-gray-700">總額: ${t.total.toLocaleString()}</span>
                                                </div>
                                            </div>
                                            <div className="text-xs text-gray-500 mb-3 line-clamp-2 md:line-clamp-none" title={t.content}>
                                                {t.type === '出貨' ? '系統出貨單 (見報表區)' : t.content}
                                            </div>
                                            
                                            <div className="flex flex-col md:flex-row md:justify-between md:items-end border-t pt-3 gap-3">
                                                <div className="flex md:flex-col gap-4 md:gap-0 justify-between items-center md:items-start">
                                                    <div className="text-xs font-bold text-green-600">已收: ${t.paid.toLocaleString()}</div>
                                                    <div className={`text-sm font-bold ${t.remain === 0 ? 'text-gray-400' : 'text-red-600'}`}>欠款: ${t.remain.toLocaleString()}</div>
                                                </div>
                                                
                                                {t.remain !== 0 && !isReadonly && (
                                                    <div className="flex gap-2 w-full md:w-auto mt-2 md:mt-0">
                                                        {payInputId === t.id ? (
                                                            <div className="flex items-center gap-2 bg-yellow-50 p-2 rounded border border-yellow-200 w-full justify-between shadow-inner">
                                                                <input type="date" value={payDate} onChange={e=>setPayDate(e.target.value)} className="border p-1 w-24 text-xs rounded"/>
                                                                <input type="number" value={payAmount} onChange={e=>setPayAmount(e.target.value)} placeholder="金額" className="border p-1 w-20 text-xs rounded"/>
                                                                <div className="space-x-1 flex">
                                                                    <button onClick={() => confirmPartialPay(t)} className="bg-green-500 text-white px-3 py-1 rounded text-xs font-bold shadow-sm">確認</button>
                                                                    <button onClick={() => setPayInputId(null)} className="bg-gray-400 text-white px-3 py-1 rounded text-xs font-bold shadow-sm">取消</button>
                                                                </div>
                                                            </div>
                                                        ) : (
                                                            <>
                                                                <button onClick={() => { setPayInputId(t.id); setPayAmount(t.remain); setPayDate(moment().format('YYYY-MM-DD')); }} className="flex-1 md:flex-none bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded text-xs font-bold hover:bg-indigo-200 transition">按次輸入已收</button>
                                                                <button onClick={() => handleFullPay(t)} className="flex-1 md:flex-none bg-green-500 text-white px-4 py-1.5 rounded text-xs font-bold hover:bg-green-600 transition shadow">一次全清</button>
                                                            </>
                                                        )}
                                                    </div>
                                                )}
                                                {t.remain === 0 && <span className="text-xs text-gray-400 font-bold bg-gray-100 px-3 py-1 rounded-full"><i className="fa-solid fa-check"></i> 已結清</span>}
                                            </div>
                                            
                                            {t.payments && t.payments.length > 0 && (
                                                <div className="mt-3 bg-gray-50 border p-2 rounded text-[10px] text-gray-600 flex flex-wrap gap-2 items-center">
                                                    <span className="font-bold text-gray-700"><i className="fa-solid fa-clock-rotate-left mr-1"></i>收款紀錄: </span>
                                                    {t.payments.map((p, i) => (
                                                        <span key={i} className="bg-white border px-1.5 py-0.5 rounded shadow-sm">
                                                            {p.date} <span className="font-bold text-green-600">(${p.amount.toLocaleString()})</span>
                                                        </span>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                    {arList.length === 0 && <div className="p-8 text-center text-gray-400 text-sm"><i className="fa-regular fa-folder-open text-2xl block mb-2"></i>尚無應收款項紀錄</div>}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const StockInTab = ({ items, inventory, onSubmit, onUpdateInv, expenseNames, transactions, role }) => {
            const isReadonly = role === ROLES.VIEWER;
            const [stockCart, setStockCart] = useState({}); 
            const [otherExpenseName, setOtherExpenseName] = useState(''); 
            const [otherExpenseAmount, setOtherExpenseAmount] = useState(''); 
            const [date, setDate] = useState(moment().format('YYYY-MM-DD')); 
            const [mode, setMode] = useState('purchase'); 
            const [startDate, setStartDate] = useState(moment().startOf('month').format('YYYY-MM-DD'));
            const [endDate, setEndDate] = useState(moment().endOf('month').format('YYYY-MM-DD'));
            const [dashboardView, setDashboardView] = useState('frozen');

            const updateCart = (id, f, v) => { setStockCart(prev => { const cur = prev[id] || { qty: 0, cost: 0, currentInv: inventory[id] || 0 }; let nc = cur.cost; if(f==='qty'&&!nc && mode==='purchase'){const it=items.find(i=>i.id===id); if(it)nc=getCostOnDate(it, date);} if(f==='cost')nc=Number(v); return {...prev, [id]:{...cur, qty:f==='qty'?Number(v):cur.qty, cost:nc}}; }); };
            
            const handleStockIn = () => { 
                if(isReadonly) return;
                if (mode === 'purchase') {
                    let totalItemCost = 0; const raw = []; let txt = '【進貨登錄】\n';
                    Object.entries(stockCart).forEach(([id,d])=>{ if(d.qty > 0){ const it=items.find(i=>i.id===id); txt+=`${it.name} x ${d.qty} (單價$${d.cost})\n`; onUpdateInv(id,d.qty); raw.push({id: it.id, name:it.name, qty:d.qty, cost:d.cost}); totalItemCost += (d.cost * d.qty); } });
                    const expenseAmt = Number(otherExpenseAmount) || 0;
                    if(raw.length === 0 && expenseAmt === 0) return alert('無內容');
                    if(expenseAmt > 0) txt += `\n【其他費用】\n${otherExpenseName || '雜支'}: $${expenseAmt}`;
                    const isFranchiseEquip = (otherExpenseName || '').includes('加盟器材');
                    const actualPnLExpense = isFranchiseEquip ? 0 : expenseAmt;
                    const rec = { id: Date.now(), date: toRecordDate(date), time: moment().format('A h:mm'), type: '進貨/支出', franchise: '-', content: txt, rawItems: raw, shipping: 0, income: 0, cost: totalItemCost + expenseAmt, rawExpenses: actualPnLExpense, profit: -actualPnLExpense, total: -(totalItemCost + expenseAmt) }; 
                    onSubmit(rec); alert('已送出進貨/支出，存檔結果會顯示在畫面上方');
                } else {
                    let txt = '【庫存校正】\n'; let raw = []; let hasChange = false; Object.entries(stockCart).forEach(([id, d]) => { const current = inventory[id] || 0; if (d.qty !== current) { const diff = d.qty - current; const it = items.find(i => i.id === id); txt += `${it.name}: ${current} -> ${d.qty} (差: ${diff})\n`; onUpdateInv(id, diff); raw.push({ id: id, name: it.name, change: diff, old: current, new: d.qty }); hasChange = true; } });
                    if (!hasChange) return alert('無變更'); const rec={id:Date.now(), date:toRecordDate(date), time:moment().format('A h:mm'), type:'庫存校正', franchise:'-', content:txt, rawItems:raw, shipping:0, income:0, cost:0, profit:0, total:0}; onSubmit(rec); alert('已校正庫存');
                }
                setStockCart({}); setOtherExpenseName(''); setOtherExpenseAmount(''); 
            };
            
            useEffect(() => { if (mode === 'correct') { const newCart = {}; items.forEach(i => { newCart[i.id] = { qty: inventory[i.id] || 0, cost: 0 }; }); setStockCart(newCart); } else { setStockCart({}); } }, [mode, items, inventory]);

            const rangeStats = useMemo(() => {
                const filteredTrans = transactions.filter(t => t.type === '進貨/支出' && txMoment(t).isBetween(startDate, endDate, 'day', '[]'));
                const stats = { frozen: { total: 0, qty: 0, items: [] }, assets: { total: 0, items: [] }, expenses: { total: 0, items: [] } };
                const frozenIds = ['cut', 'squid', 'shrimp', 'burdock'];
                const expenseMap = {}; 
                filteredTrans.forEach(t => {
                    if(t.rawItems) { t.rawItems.forEach(ri => { const amt = ri.cost * ri.qty; if(frozenIds.includes(ri.id)) { stats.frozen.total += amt; stats.frozen.qty += ri.qty; stats.frozen.items.push({ name: ri.name, val: `${ri.qty}箱 ($${amt.toLocaleString()})`, date: t.date }); } else { stats.assets.total += amt; stats.assets.items.push({ name: ri.name, val: `${ri.qty}${items.find(i=>i.id===ri.id)?.unit} ($${amt.toLocaleString()})`, date: t.date }); } }); }
                    let expName = ''; let expAmt = 0;
