                    if(t.content && t.content.includes('【其他費用】')) { const match = t.content.match(/【其他費用】\n(.*?): \$([\d,]+)/); if(match) { expName = match[1].trim(); expAmt = parseFloat(match[2].replace(/,/g, '')); } } 
                    else if (t.content && t.content.includes('雜支:')) { const match = t.content.match(/雜支: (.*?) \$([\d,]+)/); if(match) { expName = match[1].trim(); expAmt = parseFloat(match[2].replace(/,/g, '')); } }
                    if (!expName && t.rawExpenses > 0) { expName = "一般雜支(未分類)"; expAmt = t.rawExpenses; }
                    if (expAmt > 0) { if (expName.includes('加盟器材')) { stats.assets.total += expAmt; stats.assets.items.push({ name: expName, val: `$${expAmt.toLocaleString()}`, date: t.date }); } else { const key = expName.substring(0, 3); if (!expenseMap[key]) expenseMap[key] = { name: key + '...', total: 0, count: 0 }; expenseMap[key].total += expAmt; expenseMap[key].count += 1; expenseMap[key].fullName = expName; } }
                });
                stats.expenses.items = Object.values(expenseMap).map(g => ({ name: g.count > 1 ? `${g.name} (合併${g.count}筆)` : g.fullName, val: `$${g.total.toLocaleString()}`, total: g.total })).sort((a,b) => b.total - a.total);
                stats.expenses.total = stats.expenses.items.reduce((a,b) => a + b.total, 0);
                return stats;
            }, [transactions, startDate, endDate, items]);

            const currentViewData = rangeStats[dashboardView];

            return (
                <div className="space-y-6">
                    <datalist id="expense-list">{expenseNames.map(e=><option key={e} value={e}/>)}</datalist>
                    <div className="flex bg-gray-200 p-1 rounded">
                        <button onClick={()=>setMode('purchase')} className={`flex-1 py-2 rounded text-sm font-bold ${mode==='purchase'?'bg-white shadow text-blue-600':''}`}>進貨/資產登入</button>
                        <button onClick={()=>setMode('correct')} className={`flex-1 py-2 rounded text-sm font-bold ${mode==='correct'?'bg-white shadow text-red-600':''}`}>庫存校正</button>
                    </div>

                    <div className="bg-white p-4 shadow">
                        <div className="mb-4 grid grid-cols-2 gap-4">
                            <div className={isReadonly ? 'readonly-mode' : ''}><label className="text-sm text-gray-500 font-bold mr-2">操作日期</label><input type="date" value={date} onChange={e=>setDate(e.target.value)} className="border rounded p-1 w-full"/></div>
                            <div>
                                <label className="text-xs text-gray-500 font-bold block mb-1">統計區間</label>
                                <div className="flex gap-1">

                                    <select value={dashboardView} onChange={e=>setDashboardView(e.target.value)} className="text-sm border rounded p-1">
                                        <option value="frozen">四大冷凍品</option>
                                        <option value="assets">資產購置 (含器材)</option>

                                    </div>
                                    <div className="w-2/3 bg-white p-3 rounded shadow-sm border-t-4 border-gray-400 overflow-y-auto max-h-32 custom-scrollbar">
                                        <div className="text-xs text-gray-500 font-bold mb-1">明細列表</div>
                                        {currentViewData.items.length === 0 ? <div className="text-xs text-gray-300">無資料</div> : currentViewData.items.map((item, idx) => (<div key={idx} className="flex justify-between text-xs border-b border-gray-100 last:border-0 py-1"><span className="truncate pr-2">{item.name} <span className="text-gray-400">({item.date})</span></span><span className="font-bold whitespace-nowrap">{item.val}</span></div>))}
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className={`space-y-3 ${isReadonly ? 'readonly-mode' : ''}`}>
                            <div className="flex text-xs font-bold text-gray-500 pb-2 border-b"><div className="w-1/3">品項</div><div className="w-1/3">{mode==='purchase'?'進貨數量':'實際盤點數'}</div><div className="w-1/3">{mode==='purchase'?'單價(成本)':'差異預覽'}</div></div>
                            {items.map(i=>{
                                const currentInv = inventory[i.id] || 0; const inputQty = stockCart[i.id]?.qty; const diff = mode === 'correct' ? (inputQty !== undefined ? inputQty - currentInv : 0) : 0; 
                                return (
                                    <div key={i.id} className="flex items-center space-x-2 border-b pb-2"><div className="w-1/3">{i.name}<div className="text-[10px] text-gray-400">現有: {i.isBox ? formatBoxQty(currentInv) : currentInv}</div></div><div className="w-1/3"><input type="number" className={`w-full border p-1 ${mode==='correct' && diff !== 0 ? 'bg-yellow-50 font-bold':''}`} onChange={e=>updateCart(i.id,'qty',e.target.value)} value={stockCart[i.id]?.qty !== undefined ? stockCart[i.id].qty : ''} placeholder={mode==='correct' ? currentInv : '0'}/></div><div className="w-1/3">{mode === 'purchase' ? (<input type="number" className="w-full border p-1" onChange={e=>updateCart(i.id,'cost',e.target.value)} placeholder={i.cost}/>) : (<span className={`text-xs ${diff !== 0 ? 'text-red-500 font-bold' : 'text-gray-300'}`}>{diff > 0 ? `+${diff}` : diff}</span>)}</div></div>
                                );
                            })}
                        </div>
                    </div>
                    {mode === 'purchase' && (
                        <div className={`bg-white p-4 shadow ${isReadonly ? 'readonly-mode' : ''}`}>
                             <div className="text-xs font-bold text-gray-500 mb-2">其他雜支登錄 (若為"加盟器材"則計入資產)</div>
                             <div className="grid grid-cols-2 gap-4"><input type="text" list="expense-list" placeholder="項目 (如: 加盟器材, 運費)" className="border p-2" value={otherExpenseName} onChange={e=>setOtherExpenseName(e.target.value)}/><input type="number" placeholder="金額" className="border p-2" value={otherExpenseAmount} onChange={e=>setOtherExpenseAmount(e.target.value)}/></div>
                        </div>
                    )}
                    {!isReadonly && <button onClick={handleStockIn} className={`w-full py-3 rounded shadow text-white font-bold ${mode==='purchase'?'bg-blue-600':'bg-red-600'}`}>{mode === 'purchase' ? '確認登錄' : '確認校正'}</button>}
                </div>
            );
        };

        const FranchiseTab = ({ items, inventory, onSubmit, onUpdateInv, onUpdateTrans, onDelete, transactions, franchises, settings, genReceipt, role }) => {
            const isReadonly = role === ROLES.VIEWER;
            const [viewMode, setViewMode] = useState('new'); 
            const [fName, setFName] = useState(''); 
            const [payType, setPayType] = useState('cash'); 
            const [totalRevenue, setTotalRevenue] = useState(0); 
            const [incomeDate, setIncomeDate] = useState(moment().format('YYYY-MM-DD')); 
            const [setupExpenses, setSetupExpenses] = useState([]); 
            const [tempExpName, setTempExpName] = useState(''); 
            const [tempExpAmount, setTempExpAmount] = useState(''); 
            const [starterPack, setStarterPack] = useState(settings.starterPack); 
            const [equipDate, setEquipDate] = useState(''); 
            const [frozenDate, setFrozenDate] = useState(''); 
            const [selectedFranchiseId, setSelectedFranchiseId] = useState(null); 
            const [trackerData, setTrackerData] = useState(null); 
            const [cashInstData, setCashInstData] = useState({ initial: '', period: '', remaining: '', perPeriod: '' });
            const [newTrackerExpName, setNewTrackerExpName] = useState(''); 
            const [newTrackerExpAmount, setNewTrackerExpAmount] = useState('');

            useEffect(() => { setStarterPack(settings.starterPack); if(payType === 'install_chailease') { setTotalRevenue(settings.constants.chaileaseBase); } else { setTotalRevenue(''); } }, [settings, payType]);
            const chaileaseTax = payType === 'install_chailease' ? (settings.constants.chaileaseBase * 0.05) : 0;
            const chaileaseFee = payType === 'install_chailease' ? settings.constants.chaileaseFee : 0;
            const setupTotal = setupExpenses.reduce((a,b)=>a+b.amount,0);
            
            const addSetupExpense = () => { if(!tempExpName || !tempExpAmount) return; setSetupExpenses([...setupExpenses, { id: Date.now(), name: tempExpName, amount: Number(tempExpAmount) }]); setTempExpName(''); setTempExpAmount(''); };
            const removeSetupExpense = (id) => { setSetupExpenses(setupExpenses.filter(e => e.id !== id)); };
            const updateStarterQty = (idx, val) => { const newPack = [...starterPack]; newPack[idx].qty = Number(val); setStarterPack(newPack); };

            const handleFranchiseSubmit = () => { 
                if(isReadonly) return;
                if(!fName) return alert('請輸入店名'); 
                let goodsCost = 0; let equipCost = 0;
                starterPack.forEach(p => { const item = items.find(i => i.id === p.id); let unitCost = (p.id === 'equip_set') ? 43200 : getCostOnDate(item, incomeDate); const cost = unitCost * p.qty; if(p.type === 'equipment' || p.id === 'equip_set') equipCost += cost; else goodsCost += cost; if (p.qty > 0 && p.id !== 'equip_set') onUpdateInv(p.id, -p.qty); });
                const invisibleCost = chaileaseTax + chaileaseFee; const totalCost = setupTotal + equipCost + goodsCost + invisibleCost; const recordedRevenue = Number(totalRevenue); const finalProfit = recordedRevenue - totalCost;
                let content = `【加盟開通】_${fName}\n入帳日期：${toRecordDate(incomeDate)}\n`;
                if (payType === 'cash') content += `付款方式：現金\n總金額：$${recordedRevenue.toLocaleString()}\n`; else if (payType === 'install_chailease') { content += `付款方式：中租分期\n發票金額(基準)：$${recordedRevenue.toLocaleString()}\n`; content += `[隱形支出] 發票稅額: $${chaileaseTax}\n中租手續費: $${chaileaseFee}\n`; } else if (payType === 'install_cash') { content += `付款方式：現金分期\n總金額：$${recordedRevenue.toLocaleString()}\n(頭款:${cashInstData.initial}, 尾款:${cashInstData.remaining})\n`; }
                content += `------------------\n[成本結構]\n`; setupExpenses.forEach(e => content += `開辦費-${e.name}: $${e.amount}\n`); content += `器材成本: $${equipCost}\n贈品成本: $${goodsCost}\n淨利預估: $${finalProfit.toLocaleString()}`;
                const fData = { fName, incomeDate, payType, baseRevenue: totalRevenue, chaileaseTax, chaileaseFee, setupExpenses, equipDate, frozenDate, starterPack: starterPack.map(p => ({ ...p, unitCost: p.id === 'equip_set' ? 43200 : getCostOnDate(items.find(i => i.id === p.id), incomeDate) })), equipCost, goodsCost, starterCost: equipCost + goodsCost, cashInst: payType==='install_cash' ? cashInstData : null };
                const rec = { id: Date.now(), date: toRecordDate(incomeDate), time: moment().format('A h:mm'), type: '加盟', franchise: fName, content, shipping: 0, income: recordedRevenue, cost: totalCost, profit: finalProfit, total: recordedRevenue, franchiseData: fData }; 
                onSubmit(rec); alert('加盟資料已送出，存檔結果會顯示在畫面上方'); setFName(''); setSetupExpenses([]); setEquipDate(''); setFrozenDate(''); setCashInstData({ initial: '', period: '', remaining: '', perPeriod: '' });
            };
            
            const addTrackerExpense = () => { if(!newTrackerExpName || !newTrackerExpAmount) return; const newExp = { id: Date.now(), name: newTrackerExpName, amount: Number(newTrackerExpAmount) }; const newExpenses = [...(trackerData.setupExpenses || []), newExp]; setTrackerData({ ...trackerData, setupExpenses: newExpenses }); setNewTrackerExpName(''); setNewTrackerExpAmount(''); };
            const saveTrackerChanges = () => { 
                if(isReadonly) return;
                const currentSetupTotal = (trackerData.setupExpenses || []).reduce((a,b)=>a+b.amount,0); const currentEquip = trackerData.equipCost || 0; const currentGoods = trackerData.goodsCost || (trackerData.starterCost || 0) - currentEquip; const currentInvisible = (trackerData.chaileaseTax || 0) + (trackerData.chaileaseFee || 0); const totalCost = currentSetupTotal + currentEquip + currentGoods + currentInvisible; const totalRev = Number(trackerData.baseRevenue || trackerData.income); const newProfit = totalRev - totalCost;
                let newContent = `【加盟追蹤】_${trackerData.fName}\n更新日期: ${moment().format('YYYY/MM/DD')}\n器材出貨: ${trackerData.equipDate||'未定'}\n冷凍出貨: ${trackerData.frozenDate||'未定'}\n------------------\n目前總成本: $${totalCost.toLocaleString()}\n修正淨利: $${newProfit.toLocaleString()}`;
                onUpdateTrans(selectedFranchiseId, { franchiseData: trackerData, content: newContent, cost: totalCost, profit: newProfit }); alert('已更新追蹤資訊'); setSelectedFranchiseId(null);
            };
            
            const trackerSetupTotal = trackerData ? (trackerData.setupExpenses||[]).reduce((a,b)=>a+b.amount,0) : 0;

            return (

                    <div className="flex space-x-2 border-b mb-4">
                        <button onClick={()=>setViewMode('new')} className={`pb-2 px-4 ${viewMode==='new'?'border-b-2 border-indigo-600 font-bold text-indigo-600':''}`}>新增加盟</button>
                        <button onClick={()=>setViewMode('tracker')} className={`pb-2 px-4 ${viewMode==='tracker'?'border-b-2 border-indigo-600 font-bold text-indigo-600':''}`}>進度追蹤 / 補登</button>

                    {viewMode==='new' ? (
                        <div className={`space-y-4 animate-fade-in ${isReadonly ? 'readonly-mode' : ''}`}>
                            <div className="bg-slate-50 p-4 rounded border-l-4 border-indigo-500"><h4 className="font-bold mb-4 text-indigo-700">基本資料設定</h4><div className="grid grid-cols-1 md:grid-cols-2 gap-4"><input type="text" list="franchise-list-new" value={fName} onChange={e=>setFName(e.target.value)} placeholder="加盟店名" className="w-full border p-2 rounded"/><input type="date" value={incomeDate} onChange={e=>setIncomeDate(e.target.value)} className="w-full border p-2 rounded"/></div></div>
                            <div className="bg-green-50 p-4 rounded border-l-4 border-green-500"><h4 className="font-bold mb-4 text-green-700">付款方式與金額</h4><div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4"><label className="flex items-center space-x-2 bg-white p-3 rounded border"><input type="radio" name="payType" value="cash" checked={payType==='cash'} onChange={e=>setPayType(e.target.value)} /><span className="font-bold">現金全額</span></label><label className="flex items-center space-x-2 bg-white p-3 rounded border"><input type="radio" name="payType" value="install_chailease" checked={payType==='install_chailease'} onChange={e=>setPayType(e.target.value)} /><span className="font-bold">中租分期</span></label><label className="flex items-center space-x-2 bg-white p-3 rounded border"><input type="radio" name="payType" value="install_cash" checked={payType==='install_cash'} onChange={e=>setPayType(e.target.value)} /><span className="font-bold">現金分期</span></label></div>{payType === 'cash' && <input type="number" value={totalRevenue} onChange={e=>setTotalRevenue(e.target.value)} placeholder="輸入總入帳金額" className="w-full border p-3 rounded text-lg font-bold text-green-700" />}{payType === 'install_chailease' && <div className="bg-white p-3 rounded border"><span className="text-sm">發票金額:</span><input type="number" value={totalRevenue} onChange={e=>setTotalRevenue(e.target.value)} className="border p-1 w-32 ml-2 font-bold"/></div>}{payType === 'install_cash' && <div className="bg-white p-3 rounded border space-y-3"><input type="number" value={totalRevenue} onChange={e=>setTotalRevenue(e.target.value)} className="w-full border p-1 font-bold" placeholder="總金額"/><div className="grid grid-cols-2 gap-2"><input type="number" placeholder="頭款" value={cashInstData.initial} onChange={e=>setCashInstData({...cashInstData, initial:e.target.value})} className="border p-1"/><input type="number" placeholder="尾款" value={cashInstData.remaining} onChange={e=>setCashInstData({...cashInstData, remaining:e.target.value})} className="border p-1"/></div></div>}</div>
                            <div className={`p-4 rounded border-l-4 bg-gray-50 border-gray-400`}><div className="flex justify-between items-center mb-2"><h4 className="font-bold text-gray-700">開辦費支出 (預算: ${settings.constants.setupBudget.toLocaleString()})</h4><span className={settings.constants.setupBudget-setupTotal < 0 ? 'text-red-600 font-bold' : 'text-green-600 text-sm'}>剩餘: ${(settings.constants.setupBudget-setupTotal).toLocaleString()}</span></div><div className="flex gap-2 mb-2"><input type="text" placeholder="項目" value={tempExpName} onChange={e=>setTempExpName(e.target.value)} className="border p-2 flex-1 rounded"/><input type="number" placeholder="金額" className="w-24 border p-2 rounded" value={tempExpAmount} onChange={e=>setTempExpAmount(e.target.value)}/><button onClick={addSetupExpense} className="bg-gray-200 px-4 rounded font-bold text-gray-600">+</button></div><div className="text-sm max-h-32 overflow-y-auto bg-white p-2 border rounded">{setupExpenses.map(i=><div key={i.id} className="flex justify-between border-b border-gray-100 py-1"><span>{i.name}</span><span>${i.amount} <button onClick={()=>removeSetupExpense(i.id)} className="text-red-500 ml-2">x</button></span></div>)}</div></div>
                            <div className="bg-blue-50 p-4 rounded border-l-4 border-blue-500"><h4 className="font-bold text-blue-700 mb-4">加盟贈送清單</h4><div className="grid grid-cols-2 gap-4 mb-4"><div><label className="text-xs font-bold">器材/常溫出貨</label><input type="date" value={equipDate} onChange={e=>setEquipDate(e.target.value)} className="border p-2 w-full rounded"/></div><div><label className="text-xs font-bold text-blue-600">冷凍出貨</label><input type="date" value={frozenDate} onChange={e=>setFrozenDate(e.target.value)} className="border p-2 w-full rounded"/></div></div><div className="h-60 overflow-y-auto text-xs bg-white p-2 border rounded space-y-1">{starterPack.map((p, idx)=>(<div key={idx} className="flex justify-between items-center border-b pb-1"><span className={p.type==='frozen'?'text-blue-600':p.type==='equipment'?'text-orange-600 font-bold':'text-gray-700'}>{p.name}</span><div className="flex items-center"><input type="number" value={p.qty} onChange={(e)=>updateStarterQty(idx, e.target.value)} className="w-10 border text-center mr-1 rounded" /><span className="text-gray-500">{p.unit}</span></div></div>))}</div></div>
                            {!isReadonly && <button onClick={handleFranchiseSubmit} className="w-full bg-indigo-600 text-white py-4 rounded-lg font-bold text-lg shadow-lg">確認建立加盟資料</button>}
                        </div>
                    ) : (
                        <div className="space-y-4 animate-fade-in">
                            {transactions.filter(t=>t.type==='加盟').map(t=>(
                                <div key={t.id} className="border p-4 bg-white relative shadow-sm cursor-pointer hover:bg-gray-50 rounded-lg" onClick={()=>{setSelectedFranchiseId(t.id);setTrackerData(t.franchiseData)}}>
                                    <div className="flex justify-between items-center mb-2"><div className="flex items-center space-x-2"><span className="font-bold text-lg text-indigo-700">{t.franchise}</span><span className="text-xs bg-gray-200 px-2 py-0.5 rounded text-gray-600">{txMoment(t).format('YYYY/MM/DD')}</span></div><div className="text-right"><div className="font-bold text-green-600">${t.income.toLocaleString()}</div></div></div>
                                    <div className="grid grid-cols-2 gap-2 text-sm text-gray-500"><div>付款: {t.franchiseData.payType==='cash'?'現金':t.franchiseData.payType==='install_chailease'?'中租':'現金分期'}</div><div>器材: {t.franchiseData.equipDate||'未定'}</div><div>冷凍: {t.franchiseData.frozenDate||'未定'}</div></div>
                                    {!isReadonly && <button onClick={(e)=>{e.stopPropagation(); onDelete(t.id, t.type)}} className="absolute top-2 right-2 text-gray-300 hover:text-red-500 p-2"><i className="fa-solid fa-trash-can"></i></button>}
                                </div>
                            ))}
                            {selectedFranchiseId && trackerData && (
                                <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-[60]">
                                    <div className="bg-white p-6 w-full max-w-lg rounded-xl shadow-2xl overflow-y-auto max-h-[90vh]">
                                        <div className="flex justify-between items-center mb-4 border-b pb-2"><h3 className="font-bold text-xl">追蹤: {trackerData.fName}</h3><button onClick={()=>setSelectedFranchiseId(null)} className="text-gray-400 hover:text-gray-600">x</button></div>
                                        <div className={`space-y-6 ${isReadonly ? 'readonly-mode' : ''}`}>
                                            <div className="bg-blue-50 p-3 rounded border border-blue-100"><h4 className="font-bold text-sm text-blue-700 mb-2">出貨進度補登</h4><div className="grid grid-cols-2 gap-4"><div><label className="text-xs font-bold text-gray-500">器材/常溫</label><input type="date" value={trackerData.equipDate} onChange={e=>setTrackerData({...trackerData, equipDate:e.target.value})} className="border p-2 w-full rounded bg-white"/></div><div><label className="text-xs font-bold text-blue-500">冷凍出貨</label><input type="date" value={trackerData.frozenDate} onChange={e=>setTrackerData({...trackerData, frozenDate:e.target.value})} className="border p-2 w-full rounded bg-white"/></div></div></div>
                                            <div className="bg-red-50 p-3 rounded border border-red-100"><div className="flex justify-between items-center mb-2"><h4 className="font-bold text-sm text-red-700">開辦費補登</h4><span className={`text-xs ${trackerSetupTotal > settings.constants.setupBudget ? 'text-red-600 font-bold' : 'text-green-600'}`}>{trackerSetupTotal > settings.constants.setupBudget ? `已超支` : `剩餘 $${(settings.constants.setupBudget-trackerSetupTotal).toLocaleString()}`}</span></div><div className="flex gap-2 mb-2"><input type="text" placeholder="項目" value={newTrackerExpName} onChange={e=>setNewTrackerExpName(e.target.value)} className="border p-2 flex-1 rounded text-sm"/><input type="number" placeholder="金額" className="w-20 border p-2 rounded text-sm" value={newTrackerExpAmount} onChange={e=>setNewTrackerExpAmount(e.target.value)}/><button onClick={addTrackerExpense} className="bg-red-500 text-white px-3 rounded text-sm font-bold">新增</button></div><div className="max-h-32 overflow-y-auto text-sm bg-white border p-1 rounded">{(trackerData.setupExpenses||[]).map((exp, idx) => (<div key={idx} className="flex justify-between py-1 border-b border-gray-100 px-2"><span>{exp.name}</span><span>${exp.amount.toLocaleString()}</span></div>))}</div></div>
                                        </div>
                                        <div className="flex gap-3 mt-6">
                                            {!isReadonly && <button onClick={saveTrackerChanges} className="flex-1 bg-indigo-600 text-white py-3 rounded-lg font-bold">儲存變更</button>}
                                            <button onClick={()=>setSelectedFranchiseId(null)} className="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-bold">取消關閉</button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };


        // ---- 依新進價重算成本：找出調價生效日之後、仍以舊進價記帳的單據 ----
        const fmtMoney = (n) => Math.round(n || 0).toLocaleString();

        const buildCostRecalcPlan = (transactions, items, itemId) => {
            const setting = items.find(i => i.id === itemId);
            const last = [...(PRICE_HISTORY[itemId] || [])].reverse().find(h => h.cost !== undefined);
            if (!setting || !last) return null;
            const effectiveFrom = moment(last.until, 'YYYY-MM-DD').add(1, 'day');
            const oldCost = last.cost;
            const oldPrice = [...(PRICE_HISTORY[itemId] || [])].reverse().find(h => h.price !== undefined)?.price;
            const rows = []; const priceWarnings = [];
            transactions.forEach(t => {
                if (txMoment(t).isBefore(effectiveFrom, 'day')) return;
                if ((t.costAdjustments || []).some(a => a.id === itemId)) return;
                const newCost = getCostOnDate(setting, t.date);
                if (newCost === oldCost) return;
                let lines = [];
                if (['出貨', '調撥', '直營報表', '進貨/支出'].includes(t.type)) {
                    lines = (t.rawItems || []).map((ri, idx) => ({ idx, ri, qty: Number(ri.qty) || 0, used: typeof ri.cost === 'number' ? ri.cost : oldCost }));
                } else if (t.type === '加盟' && t.franchiseData && t.franchiseData.starterPack) {
                    lines = t.franchiseData.starterPack.map((ri, idx) => ({ idx, ri, qty: Number(ri.qty) || 0, used: typeof ri.unitCost === 'number' ? ri.unitCost : oldCost }));
                }
                // 只挑仍是「舊進價」的明細；手動輸入其他單價的進貨單不動
                lines = lines.filter(l => l.ri.id === itemId && l.qty > 0 && l.used === oldCost);
                if (lines.length > 0) {
                    const qty = lines.reduce((a, l) => a + l.qty, 0);
                    rows.push({ t, lines, qty, oldCost, newCost, delta: qty * (newCost - oldCost) });
                }
                if (oldPrice !== undefined && t.type === '出貨') {
                    const oldPriceQty = (t.rawItems || []).filter(ri => ri.id === itemId && ri.price === oldPrice).reduce((a, ri) => a + (Number(ri.qty) || 0), 0);
                    if (oldPriceQty > 0) priceWarnings.push({ t, qty: oldPriceQty, oldPrice, newPrice: getPriceOnDate(setting, t.date) });
                }
            });
            rows.sort((a, b) => txMoment(a.t) - txMoment(b.t));
            return { item: setting, effectiveFrom, oldCost, newCost: setting.cost, rows, priceWarnings };
        };

        const buildCostAdjustFields = (row, item) => {
            const { t, delta, oldCost, newCost } = row;
            const idxSet = new Set(row.lines.map(l => l.idx));
            const stamp = { id: item.id, from: oldCost, to: newCost, qty: row.qty, delta, at: moment().format('YYYY/MM/DD HH:mm') };
            const fields = { cost: (t.cost || 0) + delta, costAdjustments: [...(t.costAdjustments || []), stamp] };
            let content = t.content || '';
            if (t.type === '加盟') {
                const fd = t.franchiseData;
                fields.franchiseData = { ...fd, starterPack: fd.starterPack.map((p, i) => idxSet.has(i) ? { ...p, unitCost: newCost } : p), goodsCost: (fd.goodsCost || 0) + delta, starterCost: (fd.starterCost || 0) + delta };
                fields.profit = (t.profit || 0) - delta;
            } else {
                fields.rawItems = t.rawItems.map((ri, i) => idxSet.has(i) ? { ...ri, cost: newCost } : ri);
                if (t.type === '進貨/支出') {
                    fields.total = (t.total || 0) - delta; // 進貨只影響付出金額，不影響損益
                    row.lines.forEach(l => { content = content.replace(`${l.ri.name} x ${l.ri.qty} (單價$${oldCost})`, `${l.ri.name} x ${l.ri.qty} (單價$${newCost})`); });
                } else {
                    fields.profit = (t.profit || 0) - delta;
                }
            }
            fields.content = `${content}\n[成本調整 ${stamp.at}] ${item.name} 進價 $${oldCost}→$${newCost}，成本 +$${fmtMoney(delta)}`;
            return fields;
        };

        const CostRecalcPanel = ({ transactions, items, onApply, isReadonly }) => {
            const targets = Object.keys(PRICE_HISTORY).filter(id => items.find(i => i.id === id) && PRICE_HISTORY[id].some(h => h.cost !== undefined));
            const [target, setTarget] = useState(null);
            const [excluded, setExcluded] = useState({});
            const [busy, setBusy] = useState(false);
            const plan = useMemo(() => target ? buildCostRecalcPlan(transactions, items, target) : null, [target, transactions, items]);
            const selected = plan ? plan.rows.filter(r => !excluded[r.t.id]) : [];
            const totalDelta = selected.reduce((a, r) => a + r.delta, 0);
            const profitDelta = selected.filter(r => r.t.type !== '進貨/支出').reduce((a, r) => a + r.delta, 0);

            const open = (id) => { setExcluded({}); setTarget(target === id ? null : id); };
            const handleApply = async () => {
                if (isReadonly || selected.length === 0) return;
                if (!confirm(`確定將 ${selected.length} 筆單據的 ${plan.item.name} 成本改為新進價？\n成本合計 +$${fmtMoney(totalDelta)}，損益合計 -$${fmtMoney(profitDelta)}`)) return;
                setBusy(true);
                try {
                    const ok = await onApply(selected.map(r => ({ id: r.t.id, fields: buildCostAdjustFields(r, plan.item) })));
                    if (ok) { alert('已寫入成本調整'); setTarget(null); }
                } catch (e) { console.error(e); alert('寫入失敗: ' + e.message); } finally { setBusy(false); }
            };

            return (
                <div className="bg-amber-50 border border-amber-200 p-4 rounded shadow space-y-3">
                    <h3 className="font-bold text-amber-800"><i className="fa-solid fa-calculator mr-2"></i>依新進價重算成本</h3>
                    <div className="text-xs text-gray-600">調價生效日之後、仍以舊進價記帳的單據（出貨、調撥、直營日報、加盟贈品、進貨單價）。先預覽差額，勾選確認後才寫入；已調整過的單據不會重複計算。</div>
                    <div className="flex flex-wrap gap-2">
                        {targets.map(id => {
                            const it = items.find(i => i.id === id); const last = [...PRICE_HISTORY[id]].reverse().find(h => h.cost !== undefined);
                            return <button key={id} onClick={() => open(id)} className={`px-3 py-2 rounded text-sm font-bold border ${target === id ? 'bg-amber-600 text-white border-amber-600' : 'bg-white text-amber-700 border-amber-300'}`}>重算 {it.name} 成本（{moment(last.until, 'YYYY-MM-DD').add(1, 'day').format('YYYY/MM/DD')} 起）</button>;
                        })}
                    </div>
                    {plan && (
                        <div className="bg-white rounded border p-3 space-y-2">
                            <div className="text-sm"><span className="font-bold">{plan.item.name}</span>：{plan.effectiveFrom.format('YYYY/MM/DD')} 起進價 <span className="text-gray-500">${plan.oldCost}</span> → <span className="font-bold text-red-600">${plan.newCost}</span> / {plan.item.unit}</div>
                            {plan.rows.length === 0 ? <div className="text-green-600 text-sm font-bold py-2"><i className="fa-solid fa-check mr-1"></i>沒有需要重算的單據</div> : (
                                <div className="overflow-x-auto custom-scrollbar">
                                    <table className="w-full text-xs">
                                        <thead><tr className="bg-gray-100 text-gray-600"><th className="p-1">選</th><th className="p-1 text-left">日期</th><th className="p-1 text-left">類型</th><th className="p-1 text-left">對象</th><th className="p-1 text-right">數量</th><th className="p-1 text-right">原成本</th><th className="p-1 text-right">新成本</th><th className="p-1 text-right">差額</th></tr></thead>
                                        <tbody>
                                            {plan.rows.map(r => (
                                                <tr key={r.t.id} className={`border-b ${excluded[r.t.id] ? 'text-gray-300' : ''}`}>
                                                    <td className="p-1 text-center"><input type="checkbox" checked={!excluded[r.t.id]} onChange={e => setExcluded({ ...excluded, [r.t.id]: !e.target.checked })} /></td>
                                                    <td className="p-1 whitespace-nowrap">{r.t.date}</td>
                                                    <td className="p-1 whitespace-nowrap">{r.t.type}</td>
                                                    <td className="p-1">{r.t.franchise}</td>
                                                    <td className="p-1 text-right num-font">{plan.item.isBox ? formatBoxQty(r.qty) : r.qty}</td>
                                                    <td className="p-1 text-right num-font">{fmtMoney(r.qty * r.oldCost)}</td>
                                                    <td className="p-1 text-right num-font">{fmtMoney(r.qty * r.newCost)}</td>
                                                    <td className="p-1 text-right num-font font-bold text-red-600">+{fmtMoney(r.delta)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    <div className="flex flex-wrap justify-between items-center gap-2 mt-2 text-sm">
                                        <div>已選 {selected.length} 筆，成本 <span className="font-bold text-red-600">+${fmtMoney(totalDelta)}</span>，損益 <span className="font-bold text-red-600">-${fmtMoney(profitDelta)}</span><div className="text-[10px] text-gray-400">進貨單只修正付出金額，不影響損益</div></div>
                                        {!isReadonly && <button disabled={busy || selected.length === 0} onClick={handleApply} className="bg-red-600 disabled:bg-gray-300 text-white px-4 py-2 rounded font-bold">{busy ? '寫入中...' : '確認寫入'}</button>}
                                    </div>
                                </div>
                            )}
                            {plan.priceWarnings.length > 0 && (
                                <div className="bg-yellow-50 border border-yellow-200 rounded p-2 text-xs text-yellow-800">
                                    <div className="font-bold mb-1"><i className="fa-solid fa-triangle-exclamation mr-1"></i>以下出貨單仍以舊售價開立（此工具不改營收與應收，請視需要個別處理）</div>
                                    {plan.priceWarnings.map(w => <div key={w.t.id}>{w.t.date} {w.t.franchise}：{w.qty}{plan.item.unit} × ${w.oldPrice}（新售價 ${w.newPrice}，差 ${fmtMoney(w.qty * (w.newPrice - w.oldPrice))}）</div>)}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        // ---- 圖表分析 ----
        const ChartCanvas = ({ config, height = 300 }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (!ref.current || !config) return;
                const chart = new Chart(ref.current, config);
                return () => chart.destroy();
            }, [config]);
            return <div className="relative" style={{ height }}><canvas ref={ref}></canvas></div>;
        };

        const shortMoney = (v) => Math.abs(v) >= 10000 ? `${(v / 10000).toFixed(1)}萬` : Math.round(v).toLocaleString();

        // 與「總覽儀表板」相同的損益口徑
        const summarizeTrans = (list) => {
            const s = { shipRev: 0, shipGoods: 0, shipFreight: 0, transfer: 0, directRev: 0, directGoods: 0, directExp: 0, franRev: 0, franCost: 0, misc: 0 };
            list.forEach(t => {
                if (t.type === '出貨') { const fr = Number(t.shipping) || 0; s.shipRev += t.income || 0; s.shipFreight += fr; s.shipGoods += (t.cost || 0) - fr; }
                else if (t.type === '調撥') s.transfer += t.cost || 0;
                else if (t.type === '加盟') { s.franRev += t.income || 0; s.franCost += t.cost || 0; }
                else if (t.type === '進貨/支出') { if (t.rawExpenses > 0) s.misc += t.rawExpenses; else { const m = (t.content || '').match(/雜支:.*?\$([\d,]+)/); if (m) s.misc += parseFloat(m[1].replace(/,/g, '')); } }
                else if (t.type === '直營報表') { const e = t.rawExpenses || 0; s.directRev += t.income || 0; s.directExp += e; s.directGoods += (t.cost || 0) - e; }
            });
            s.rev = s.shipRev + s.directRev + s.franRev;
            s.varCost = s.shipGoods + s.shipFreight + s.transfer + s.directGoods + s.directExp + s.franCost + s.misc;
            s.net = s.rev - s.varCost;
            return s;
        };

        const FROZEN_IDS = ['cut', 'squid', 'shrimp', 'burdock'];

        const AnalyticsView = ({ transactions, items, rangeTrans, fixedPerMonth, monthsInRange, end }) => {
            const noLabels = { datalabels: { display: false } };
            const months = useMemo(() => { const arr = []; const e = moment(end).startOf('month'); for (let i = 5; i >= 0; i--) arr.push(e.clone().subtract(i, 'month').format('YYYY-MM')); return arr; }, [end]);
            const byMonth = useMemo(() => { const map = {}; months.forEach(m => map[m] = []); transactions.forEach(t => { const m = txMoment(t).format('YYYY-MM'); if (map[m]) map[m].push(t); }); return map; }, [transactions, months]);

            // 1. 區間損益瀑布
            const range = useMemo(() => summarizeTrans(rangeTrans), [rangeTrans]);
            const fixedTotal = fixedPerMonth * monthsInRange;
            const waterfall = useMemo(() => {
                const steps = [
                    ['出貨營收', range.shipRev], ['直營業績', range.directRev], ['加盟收入', range.franRev],
                    ['出貨商品成本', -range.shipGoods], ['物流運費', -range.shipFreight], ['調撥成本', -range.transfer],
                    ['直營材料', -range.directGoods], ['直營支出', -range.directExp], ['加盟成本', -range.franCost], ['營運雜支', -range.misc],
                    ['固定成本', -fixedTotal]
                ].filter(([, v]) => Math.round(v) !== 0);
                let run = 0; const labels = []; const data = []; const colors = [];
                steps.forEach(([label, v]) => { labels.push(label); data.push([run, run + v]); colors.push(v >= 0 ? '#16a34a' : '#ef4444'); run += v; });
                labels.push('淨利'); data.push([0, run]); colors.push(run >= 0 ? '#ca8a04' : '#b91c1c');
                return { type: 'bar', data: { labels, datasets: [{ data, backgroundColor: colors }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, title: { display: true, text: `區間損益瀑布（已扣 ${monthsInRange} 個月固定成本）` }, tooltip: { callbacks: { label: c => { const [a, b] = c.raw; return `$${fmtMoney(b - a)}`; } } }, datalabels: { anchor: 'end', align: 'top', font: { size: 10 }, formatter: (v, c) => c.dataIndex === labels.length - 1 ? shortMoney(v[1]) : shortMoney(v[1] - v[0]) } }, scales: { y: { ticks: { callback: v => shortMoney(v) } } } } };
            }, [range, fixedTotal, monthsInRange]);

            // 2. 近 6 個月損益趨勢
            const trend = useMemo(() => {
                const sums = months.map(m => summarizeTrans(byMonth[m]));
                return { type: 'bar', data: { labels: months, datasets: [
                    { type: 'line', label: '淨利(扣固定成本)', data: sums.map(s => s.net - fixedPerMonth), borderColor: '#ca8a04', backgroundColor: '#ca8a04', tension: 0.3 },
                    { label: '營收', data: sums.map(s => s.rev), backgroundColor: '#3b82f6' },
                    { label: '變動成本+支出', data: sums.map(s => s.varCost), backgroundColor: '#f87171' },
                    { label: '固定成本', data: sums.map(() => fixedPerMonth), backgroundColor: '#cbd5e1' }
                ] }, options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { ...noLabels, title: { display: true, text: `近 6 個月損益趨勢（至 ${months[5]}）` }, legend: { position: 'bottom' }, tooltip: { callbacks: { label: c => `${c.dataset.label}: $${fmtMoney(c.raw)}` } } }, scales: { y: { ticks: { callback: v => shortMoney(v) } } } } };
            }, [months, byMonth, fixedPerMonth]);

            // 3. 單品毛利（區間內出貨）
            const itemMargins = useMemo(() => {
                const map = {};
                rangeTrans.filter(t => t.type === '出貨').forEach(t => (t.rawItems || []).forEach(ri => {
                    if (!ri.id) return;
                    const setting = items.find(i => i.id === ri.id);
                    if (!map[ri.id]) map[ri.id] = { id: ri.id, name: setting ? setting.name : ri.name, unit: ri.unit, isBox: !!(setting && setting.isBox), qty: 0, rev: 0, cost: 0 };
                    const unitCost = typeof ri.cost === 'number' ? ri.cost : getCostOnDate(setting, t.date);
                    map[ri.id].qty += ri.qty; map[ri.id].rev += (ri.price || 0) * ri.qty; map[ri.id].cost += unitCost * ri.qty;
                }));
                return Object.values(map).map(r => ({ ...r, margin: r.rev - r.cost, rate: r.rev ? (r.rev - r.cost) / r.rev : 0 })).sort((a, b) => b.margin - a.margin);
            }, [rangeTrans, items]);
            const maxMargin = Math.max(1, ...itemMargins.map(r => Math.abs(r.margin)));

            // 4. 應收帳齡（截至今天，不受區間影響）
            const aging = useMemo(() => {
                const buckets = ['0–30天', '31–60天', '61–90天', '90天以上']; const map = {};
                transactions.filter(t => (t.type === '出貨' && t.total > 0) || t.type === '應收帳款').forEach(t => {
                    const remain = (t.total || 0) - (t.payments || []).reduce((a, p) => a + p.amount, 0);
                    if (remain <= 0) return;
                    const days = moment().diff(txMoment(t), 'days');
                    const b = days <= 30 ? 0 : days <= 60 ? 1 : days <= 90 ? 2 : 3;
                    if (!map[t.franchise]) map[t.franchise] = [0, 0, 0, 0];
                    map[t.franchise][b] += remain;
                });
                const names = Object.keys(map).sort((a, b) => map[b].reduce((x, y) => x + y, 0) - map[a].reduce((x, y) => x + y, 0));
                const total = names.reduce((a, n) => a + map[n].reduce((x, y) => x + y, 0), 0);
                const overdue = names.reduce((a, n) => a + map[n][2] + map[n][3], 0);
                const colors = ['#93c5fd', '#fbbf24', '#f97316', '#dc2626'];
                return { total, overdue, count: names.length, config: { type: 'bar', data: { labels: names, datasets: buckets.map((b, i) => ({ label: b, data: names.map(n => map[n][i]), backgroundColor: colors[i] })) }, options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { ...noLabels, title: { display: true, text: '各加盟店未收款帳齡' }, legend: { position: 'bottom' }, tooltip: { callbacks: { label: c => `${c.dataset.label}: $${fmtMoney(c.raw)}` } } }, scales: { x: { stacked: true, ticks: { callback: v => shortMoney(v) } }, y: { stacked: true } } } } };
            }, [transactions]);

            // 5. 加盟店月進貨趨勢
            const franchiseTrend = useMemo(() => {
                const map = {};
                months.forEach((m, mi) => byMonth[m].forEach(t => { if (t.type !== '出貨' || !t.franchise || t.franchise === '湳雅直營店') return; if (!map[t.franchise]) map[t.franchise] = months.map(() => 0); map[t.franchise][mi] += t.income || 0; }));
                const names = Object.keys(map).sort((a, b) => map[b].reduce((x, y) => x + y, 0) - map[a].reduce((x, y) => x + y, 0)).slice(0, 8);
                const palette = ['#2563eb', '#16a34a', '#db2777', '#ea580c', '#7c3aed', '#0891b2', '#ca8a04', '#64748b'];
                return { type: 'line', data: { labels: months, datasets: names.map((n, i) => ({ label: n, data: map[n], borderColor: palette[i], backgroundColor: palette[i], tension: 0.3 })) }, options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { ...noLabels, title: { display: true, text: '加盟店月進貨金額（前 8 名）' }, legend: { position: 'bottom' }, tooltip: { callbacks: { label: c => `${c.dataset.label}: $${fmtMoney(c.raw)}` } } }, scales: { y: { ticks: { callback: v => shortMoney(v) } } } } };
            }, [months, byMonth]);

            // 6. 冷凍品進貨 vs 出庫箱數
            const boxFlow = useMemo(() => {
                const inQ = months.map(() => 0); const outQ = months.map(() => 0);
                months.forEach((m, mi) => byMonth[m].forEach(t => {
                    const frozen = (list) => (list || []).filter(ri => FROZEN_IDS.includes(ri.id)).reduce((a, ri) => a + (Number(ri.qty) || 0), 0);
                    if (t.type === '進貨/支出') inQ[mi] += frozen(t.rawItems);
                    else if (['出貨', '調撥', '直營報表'].includes(t.type)) outQ[mi] += frozen(t.rawItems);
                    else if (t.type === '加盟' && t.franchiseData) outQ[mi] += frozen(t.franchiseData.starterPack);
                }));
                return { type: 'bar', data: { labels: months, datasets: [{ label: '進貨箱數', data: inQ, backgroundColor: '#16a34a' }, { label: '出庫箱數(出貨/調撥/直營/加盟)', data: outQ, backgroundColor: '#3b82f6' }] }, options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { title: { display: true, text: '四大冷凍品 進貨 vs 出庫（箱）' }, legend: { position: 'bottom' }, datalabels: { anchor: 'end', align: 'top', font: { size: 10 }, formatter: v => v ? formatBoxQty(v) : '' }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${formatBoxQty(c.raw)}` } } } } };
            }, [months, byMonth]);

            const netAfterFixed = range.net - fixedTotal;
            return (
                <div className="space-y-4 animate-fade-in">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div className="bg-blue-50 p-3 rounded shadow border-l-4 border-blue-500"><div className="text-xs text-gray-500 font-bold">區間營收</div><div className="text-lg font-bold text-blue-700 num-font">${fmtMoney(range.rev)}</div></div>
                        <div className="bg-red-50 p-3 rounded shadow border-l-4 border-red-400"><div className="text-xs text-gray-500 font-bold">成本+支出(含固定)</div><div className="text-lg font-bold text-red-600 num-font">-${fmtMoney(range.varCost + fixedTotal)}</div></div>
                        <div className="bg-yellow-50 p-3 rounded shadow border-l-4 border-yellow-500"><div className="text-xs text-gray-500 font-bold">淨利(扣固定成本)</div><div className={`text-lg font-bold num-font ${netAfterFixed >= 0 ? 'text-green-600' : 'text-red-600'}`}>${fmtMoney(netAfterFixed)}</div><div className="text-[10px] text-gray-400">淨利率 {range.rev ? (netAfterFixed / range.rev * 100).toFixed(1) : 0}%</div></div>
                        <div className="bg-purple-50 p-3 rounded shadow border-l-4 border-purple-500"><div className="text-xs text-gray-500 font-bold">未收款(今日)</div><div className="text-lg font-bold text-purple-700 num-font">${fmtMoney(aging.total)}</div><div className={`text-[10px] ${aging.overdue > 0 ? 'text-red-600 font-bold' : 'text-gray-400'}`}>逾 60 天 ${fmtMoney(aging.overdue)}</div></div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="bg-white p-3 rounded shadow"><ChartCanvas config={waterfall} /></div>
                        <div className="bg-white p-3 rounded shadow"><ChartCanvas config={trend} /></div>
                    </div>
                    <div className="bg-white p-4 rounded shadow">
                        <h3 className="font-bold text-gray-700 mb-2">單品毛利（區間內出貨給加盟店）</h3>
                        {itemMargins.length === 0 ? <div className="text-sm text-gray-400">區間內沒有出貨資料</div> : (
                            <div className="overflow-x-auto custom-scrollbar">
                                <table className="w-full text-xs md:text-sm">
                                    <thead><tr className="bg-gray-100 text-gray-600"><th className="p-1 text-left">品項</th><th className="p-1 text-right">數量</th><th className="p-1 text-right">營收</th><th className="p-1 text-right">成本</th><th className="p-1 text-right">毛利</th><th className="p-1 text-right">毛利率</th><th className="p-1 w-1/4"></th></tr></thead>
                                    <tbody>
                                        {itemMargins.map(r => (
                                            <tr key={r.id} className="border-b">
                                                <td className="p-1 font-bold whitespace-nowrap">{r.name}{PRICE_HISTORY[r.id] && <span className="ml-1 text-[10px] bg-amber-100 text-amber-700 px-1 rounded">調價 {moment(PRICE_HISTORY[r.id][PRICE_HISTORY[r.id].length - 1].until, 'YYYY-MM-DD').add(1, 'day').format('M/D')}</span>}</td>
                                                <td className="p-1 text-right num-font whitespace-nowrap">{r.isBox ? formatBoxQty(r.qty) : r.qty}{r.unit}</td>
                                                <td className="p-1 text-right num-font">{fmtMoney(r.rev)}</td>
                                                <td className="p-1 text-right num-font text-red-500">{fmtMoney(r.cost)}</td>
                                                <td className={`p-1 text-right num-font font-bold ${r.margin >= 0 ? 'text-green-600' : 'text-red-600'}`}>{fmtMoney(r.margin)}</td>
                                                <td className="p-1 text-right num-font">{(r.rate * 100).toFixed(1)}%</td>
                                                <td className="p-1"><div className={`h-2 rounded ${r.margin >= 0 ? 'bg-green-400' : 'bg-red-400'}`} style={{ width: `${Math.abs(r.margin) / maxMargin * 100}%` }}></div></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                <div className="text-[10px] text-gray-400 mt-1">成本以每筆出貨當時記錄的進價計算；調價前的舊單據可到「設定 → 依新進價重算成本」修正。</div>
                            </div>
                        )}
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="bg-white p-3 rounded shadow">{aging.count === 0 ? <div className="h-[300px] flex items-center justify-center text-green-600 font-bold"><i className="fa-solid fa-check mr-2"></i>目前沒有未收款</div> : <ChartCanvas config={aging.config} height={Math.max(300, aging.count * 36 + 90)} />}</div>
                        <div className="bg-white p-3 rounded shadow"><ChartCanvas config={franchiseTrend} /></div>
                    </div>
                    <div className="bg-white p-3 rounded shadow"><ChartCanvas config={boxFlow} /></div>
                </div>
            );
        };

        const ReportTab = ({ transactions, onDelete, items, role, settings, onApplyTransUpdates }) => {
            const isReadonly = role === ROLES.VIEWER;
            const [viewMode, setViewMode] = useState('dashboard');
            const [reportCategory, setReportCategory] = useState('all');

            const [start, setStart] = useState(moment().startOf('month').format('YYYY-MM-DD'));
            const [end, setEnd] = useState(moment().endOf('month').format('YYYY-MM-DD'));
            const [filterType, setFilterType] = useState('all');
            const expenseChartRef = useRef(null); const franchiseChartRef = useRef(null);
            const expenseChart = useRef(null); const franchiseChart = useRef(null);

            const allTransInRange = useMemo(() => transactions.filter(t => txMoment(t).isBetween(start, end, 'day', '[]')), [transactions, start, end]);
            const invalidDateTrans = useMemo(() => transactions.filter(t => !hasValidDate(t)), [transactions]);
            // 近 30 天新增、但日期不在目前區間的紀錄
            const recentOutside = useMemo(() => transactions.filter(t => moment().diff(moment(Number(t.id)), 'days') <= 30 && !txMoment(t).isBetween(start, end, 'day', '[]')), [transactions, start, end]);
            const setRange = (key) => {
                if (key === 'month') { setStart(moment().startOf('month').format('YYYY-MM-DD')); setEnd(moment().endOf('month').format('YYYY-MM-DD')); }
                else if (key === 'last') { setStart(moment().subtract(1, 'month').startOf('month').format('YYYY-MM-DD')); setEnd(moment().subtract(1, 'month').endOf('month').format('YYYY-MM-DD')); }
                else if (key === 'year') { setStart(moment().startOf('year').format('YYYY-MM-DD')); setEnd(moment().endOf('year').format('YYYY-MM-DD')); }
                else if (key === 'all') {
                    const ms = transactions.map(txMoment).filter(m => m.isValid());
                    setStart((ms.length ? moment.min(ms) : moment()).format('YYYY-MM-DD'));
                    setEnd(moment.max([moment(), ...ms]).format('YYYY-MM-DD'));
                }
            };
            const fixInvalidDates = async () => {
                if (isReadonly || invalidDateTrans.length === 0) return;
                if (!confirm(`將 ${invalidDateTrans.length} 筆日期無效的資料，日期改為其建立日？`)) return;
                try {
                    const ok = await onApplyTransUpdates(invalidDateTrans.map(t => ({ id: t.id, fields: { date: txMoment(t).format('YYYY/MM/DD') } })));
                    if (ok) alert('已修正日期');
                } catch (e) { console.error(e); alert('修正失敗: ' + e.message); }
            };
            const displayTrans = useMemo(() => {
                if (filterType === 'recent') return [...transactions].sort((a, b) => b.id - a.id).slice(0, 30);
                let list = allTransInRange;
                if(filterType !== 'all') {
                    if (filterType === 'order') list = list.filter(t => t.type === '出貨');
                    else if (filterType === 'transfer') list = list.filter(t => t.type === '調撥');
                    else if (filterType === 'stockIn') list = list.filter(t => t.type === '進貨/支出' || t.type === '庫存校正');
                    else if (filterType === 'franchise') list = list.filter(t => t.type === '加盟');
                }
                return list.sort((a, b) => b.id - a.id);
            }, [allTransInRange, filterType, transactions]);

            const stats = useMemo(() => {
                let s = { shipmentRev: 0, shipmentCost: 0, shipmentMargin: 0, transferCost: 0, franchiseRev: 0, franchiseCost: 0, franchiseProfit: 0, franchiseTaxTotal: 0, expenses: 0, directStoreSales: 0, directStoreExp: 0, directStoreCost: 0, directStoreNet: 0 };
                allTransInRange.forEach(t => {
                    if (t.type === '出貨') { s.shipmentRev += t.income; s.shipmentCost += t.cost; } 
                    else if (t.type === '調撥') { s.transferCost += t.cost; }
                    else if (t.type === '加盟') { s.franchiseRev += t.income; s.franchiseCost += t.cost; s.franchiseProfit += t.profit; if(t.franchiseData && t.franchiseData.chaileaseTax) { s.franchiseTaxTotal += t.franchiseData.chaileaseTax; } } 
                    else if (t.type === '進貨/支出') { if (t.rawExpenses > 0) { s.expenses += t.rawExpenses; } else { const match = t.content.match(/雜支:.*?\$([\d,]+)/); if (match) s.expenses += parseFloat(match[1].replace(/,/g, '')); } } 
                    else if (t.type === '直營報表') { s.directStoreSales += t.income; const expense = t.rawExpenses || 0; const cogs = t.cost - expense; s.directStoreExp += expense; s.directStoreCost += cogs; }
                });
                s.shipmentMargin = s.shipmentRev - s.shipmentCost; s.directStoreNet = s.directStoreSales - (s.directStoreExp + s.directStoreCost); return s;
            }, [allTransInRange]);

            const dfc = settings?.constants?.directFixedCosts || {};
            const cfc = settings?.constants?.companyFixedCosts || {};
            const directFixedTotal = (dfc.salary || 0) + (dfc.warehouseRent || 0) + (dfc.boothRent || 0);
            const companyFixedTotal = (cfc.officeRent || 0) + (cfc.ctbcLoan || 0) + (cfc.chaileaseLoan || 0);
            const allFixedCosts = directFixedTotal + companyFixedTotal;

            // 計算選取區間涵蓋幾個月份，按月份數乘以固定成本
            const monthsInRange = useMemo(() => {
                const s = moment(start); const e = moment(end);
                const months = new Set();
                const cur = s.clone().startOf('month');
                while (cur.isSameOrBefore(e)) { months.add(cur.format('YYYY-MM')); cur.add(1, 'month'); }
                return months.size;
            }, [start, end]);
            const totalFixedForRange = allFixedCosts * monthsInRange;

            const companyNetProfit = (stats.shipmentRev + stats.franchiseRev + stats.directStoreSales) - (stats.shipmentCost + stats.franchiseCost + stats.transferCost + stats.expenses + stats.directStoreExp + stats.directStoreCost);
            const companyNetProfitAfterFixed = companyNetProfit - totalFixedForRange;
            
            const monthlyData = useMemo(() => {
                const grouped = {};
                const totals = { shipment: { rev: 0, cost: 0, profit: 0 }, direct: { rev: 0, cost: 0, profit: 0 }, franchise: { rev: 0, cost: 0, profit: 0 } };

                allTransInRange.forEach(t => {
                    const month = txMoment(t).format('YYYY-MM');
                    if (!grouped[month]) { grouped[month] = { shipment: { rev: 0, cost: 0, profit: 0, items: [] }, direct: { rev: 0, cost: 0, profit: 0, items: [] }, franchise: { rev: 0, cost: 0, profit: 0, items: [] } }; }

                    if (t.type === '出貨') {
                        grouped[month].shipment.rev += t.income; grouped[month].shipment.cost += t.cost; grouped[month].shipment.profit += t.profit;
                        grouped[month].shipment.items.push({ date: t.date, title: t.franchise, rev: t.income, cost: t.cost, profit: t.profit });
                        totals.shipment.rev += t.income; totals.shipment.cost += t.cost; totals.shipment.profit += t.profit;
                    } else if (t.type === '直營報表') {
                        grouped[month].direct.rev += t.income; const expense = t.rawExpenses || 0; const cogs = t.cost - expense; const totalCost = expense + cogs;
                        grouped[month].direct.cost += totalCost; grouped[month].direct.profit += (t.income - totalCost);
                        grouped[month].direct.items.push({ date: t.date, title: '湳雅直營店', rev: t.income, cost: totalCost, profit: (t.income - totalCost) });
                        totals.direct.rev += t.income; totals.direct.cost += totalCost; totals.direct.profit += (t.income - totalCost);
                    } else if (t.type === '加盟') {
                        grouped[month].franchise.rev += t.income; grouped[month].franchise.cost += t.cost; grouped[month].franchise.profit += t.profit;
                        grouped[month].franchise.items.push({ date: t.date, title: t.franchise, rev: t.income, cost: t.cost, profit: t.profit });
                        totals.franchise.rev += t.income; totals.franchise.cost += t.cost; totals.franchise.profit += t.profit;
                    }
                });

                return { months: Object.keys(grouped).sort((a,b) => b.localeCompare(a)), grouped, totals };
            }, [allTransInRange]);

            const getGrandTotal = () => {
                let rev = 0, cost = 0, profit = 0;
                if (reportCategory === 'all' || reportCategory === 'shipment') { rev += monthlyData.totals.shipment.rev; cost += monthlyData.totals.shipment.cost; profit += monthlyData.totals.shipment.profit; }
                if (reportCategory === 'all' || reportCategory === 'direct') { rev += monthlyData.totals.direct.rev; cost += monthlyData.totals.direct.cost; profit += monthlyData.totals.direct.profit; }
                if (reportCategory === 'all' || reportCategory === 'franchise') { rev += monthlyData.totals.franchise.rev; cost += monthlyData.totals.franchise.cost; profit += monthlyData.totals.franchise.profit; }
                return { rev, cost, profit };
            };

            const exportToCSV = () => {
                let csvContent = "\uFEFF月份,日期,類型,對象,營收(收入),成本(支出),淨利\n";
                monthlyData.months.forEach(month => {
                    const mData = monthlyData.grouped[month];
                    if (reportCategory === 'all' || reportCategory === 'shipment') { mData.shipment.items.forEach(it => { csvContent += `${month},${it.date},出貨,${it.title || '-'},${it.rev},${it.cost},${it.profit}\n`; }); }
                    if (reportCategory === 'all' || reportCategory === 'direct') { mData.direct.items.forEach(it => { csvContent += `${month},${it.date},直營,${it.title},${it.rev},${it.cost},${it.profit}\n`; }); }
                    if (reportCategory === 'all' || reportCategory === 'franchise') { mData.franchise.items.forEach(it => { csvContent += `${month},${it.date},加盟,${it.title || '-'},${it.rev},${it.cost},${it.profit}\n`; }); }
                });
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                const safeStart = start.replace(/-/g, '');
                const safeEnd = end.replace(/-/g, '');
                link.setAttribute("download", `區間報表_${safeStart}_至_${safeEnd}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const expenseBreakdown = useMemo(() => {
                const map = {};
                allTransInRange.forEach(t => {
                    if (t.type === '進貨/支出') { const match = t.content.match(/【其他費用】\n(.*?): \$([\d,]+)/); if (match) { const name = match[1].trim(); if (!name.includes('加盟器材')) { map[name] = (map[name] || 0) + parseFloat(match[2].replace(/,/g, '')); } } else if (t.content.match(/雜支: (.*?) \$([\d,]+)/)) { const m = t.content.match(/雜支: (.*?) \$([\d,]+)/); map[m[1]] = (map[m[1]] || 0) + parseFloat(m[2].replace(/,/g, '')); } } 
                    else if (t.type === '直營報表' && t.rawExpenses > 0) map['直營店-營運支出'] = (map['直營店-營運支出'] || 0) + t.rawExpenses; 
                    else if (t.type === '加盟' && t.franchiseData) { if (t.franchiseData.setupExpenses) t.franchiseData.setupExpenses.forEach(e => map['加盟開辦費'] = (map['加盟開辦費'] || 0) + e.amount); if (t.franchiseData.starterCost > 0) map['加盟-贈品成本'] = (map['加盟-贈品成本'] || 0) + t.franchiseData.starterCost; if (t.franchiseData.chaileaseTax > 0) map['加盟-隱形稅額'] = (map['加盟-隱形稅額'] || 0) + t.franchiseData.chaileaseTax; if (t.franchiseData.chaileaseFee > 0) map['加盟-中租手續費'] = (map['加盟-中租手續費'] || 0) + t.franchiseData.chaileaseFee; } 
                    else if (t.type === '出貨' && Number(t.shipping) > 0) map['物流運費成本'] = (map['物流運費成本'] || 0) + Number(t.shipping);
                });
                return map;
            }, [allTransInRange]);

            const frozenStats = useMemo(() => {
                const targetIds = ['cut', 'squid', 'shrimp', 'burdock']; const totalQty = { 'cut': 0, 'squid': 0, 'shrimp': 0, 'burdock': 0 }; const franchiseMap = {};
                allTransInRange.forEach(t => { if(t.type === '出貨' && t.franchise && t.franchise !== '湳雅直營店' && t.rawItems) { if(!franchiseMap[t.franchise]) franchiseMap[t.franchise] = { cut:0, squid:0, shrimp:0, burdock:0 }; t.rawItems.forEach(item => { if(targetIds.includes(item.id)) { totalQty[item.id] += item.qty; franchiseMap[t.franchise][item.id] += (item.qty * item.price); } }); } });
                return { totalQty, franchiseMap };
            }, [allTransInRange]);

            useEffect(() => {
                if(viewMode === 'dashboard') {
                    if(expenseChart.current) expenseChart.current.destroy(); if(franchiseChart.current) franchiseChart.current.destroy();
                    if (expenseChartRef.current) expenseChart.current = new Chart(expenseChartRef.current, { type: 'pie', data: { labels: Object.keys(expenseBreakdown), datasets: [{ data: Object.values(expenseBreakdown), backgroundColor: ['#ef4444', '#f97316', '#eab308', '#84cc16', '#06b6d4', '#6366f1'] }] }, options: { plugins: { title: { display: true, text: '公司總支出分布' }, legend: { position: 'bottom' } } } });
                    if (franchiseChartRef.current) { const franchises = Object.keys(frozenStats.franchiseMap); franchiseChart.current = new Chart(franchiseChartRef.current, { type: 'bar', data: { labels: franchises, datasets: [ { label: '花枝($)', data: franchises.map(f => frozenStats.franchiseMap[f].cut), backgroundColor: '#3b82f6', stack:'0' }, { label: '墨魚($)', data: franchises.map(f => frozenStats.franchiseMap[f].squid), backgroundColor: '#1d4ed8', stack:'0' }, { label: '蝦球($)', data: franchises.map(f => frozenStats.franchiseMap[f].shrimp), backgroundColor: '#60a5fa', stack:'0' }, { label: '牛蒡($)', data: franchises.map(f => frozenStats.franchiseMap[f].burdock), backgroundColor: '#93c5fd', stack:'0' } ] }, options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { title: { display: true, text: '各加盟店四大冷凍品進貨金額' }, legend: { position: 'bottom' } } } }); }
                }
            }, [expenseBreakdown, frozenStats, viewMode]);

            return (
                <div className="space-y-6">
                    <div className="flex space-x-2 border-b mb-4">
                        <button onClick={()=>setViewMode('dashboard')} className={`pb-2 px-4 ${viewMode==='dashboard'?'border-b-2 border-indigo-600 font-bold text-indigo-600':'text-gray-500'}`}>總覽儀表板</button>
                        <button onClick={()=>setViewMode('monthly')} className={`pb-2 px-4 ${viewMode==='monthly'?'border-b-2 border-indigo-600 font-bold text-indigo-600':'text-gray-500'}`}>區間月結報表</button>
                        <button onClick={()=>setViewMode('charts')} className={`pb-2 px-4 ${viewMode==='charts'?'border-b-2 border-indigo-600 font-bold text-indigo-600':'text-gray-500'}`}>圖表分析</button>
                    </div>

                    <div className="bg-white p-4 rounded shadow flex items-center gap-4">
                        <h2 className="font-bold">區間選擇</h2>
                        <input type="date" value={start} onChange={e => setStart(e.target.value)} className="border p-1 rounded" />
                        <span>to</span>
                        <input type="date" value={end} onChange={e => setEnd(e.target.value)} className="border p-1 rounded" />
                        <div className="flex flex-wrap gap-1">
                            {[['month', '本月'], ['last', '上月'], ['year', '今年'], ['all', '全部期間']].map(([k, l]) => <button key={k} onClick={() => setRange(k)} className="text-xs border rounded px-2 py-1 bg-gray-50 hover:bg-indigo-50">{l}</button>)}
                        </div>
                    </div>
                    {invalidDateTrans.length > 0 && (
                        <div className="bg-red-50 border border-red-200 text-red-700 p-3 rounded text-sm flex flex-wrap justify-between items-center gap-2">
                            <div><i className="fa-solid fa-triangle-exclamation mr-1"></i>有 {invalidDateTrans.length} 筆資料登錄時日期欄空白（{invalidDateTrans.slice(0, 3).map(t => `${t.type} ${t.franchise !== '-' ? t.franchise : ''}`).join('、')}{invalidDateTrans.length > 3 ? '…' : ''}），目前暫以「建立日」計入報表。</div>
                            {!isReadonly && <button onClick={fixInvalidDates} className="bg-red-600 text-white px-3 py-1 rounded text-xs font-bold">一鍵修正為建立日</button>}
                        </div>
                    )}
                    {recentOutside.length > 0 && (
                        <div className="bg-orange-50 border border-orange-200 text-orange-800 p-3 rounded text-sm flex flex-wrap justify-between items-center gap-2">
                            <div><i className="fa-solid fa-circle-info mr-1"></i>近 30 天新增的 {recentOutside.length} 筆資料，日期不在目前區間（{recentOutside.slice(0, 3).map(t => `${t.type} ${txMoment(t).format('YYYY/MM/DD')}`).join('、')}{recentOutside.length > 3 ? '…' : ''}），所以沒有算進下方數字。</div>
                            <button onClick={() => setRange('all')} className="bg-orange-500 text-white px-3 py-1 rounded text-xs font-bold">顯示全部期間</button>
                        </div>
                    )}
                    
                    {viewMode === 'charts' ? (
                        <AnalyticsView transactions={transactions} items={items} rangeTrans={allTransInRange} fixedPerMonth={allFixedCosts} monthsInRange={monthsInRange} end={end} />
                    ) : viewMode === 'dashboard' ? (
                        <div className="space-y-6 animate-fade-in">
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div className="bg-blue-50 p-3 rounded shadow border-l-4 border-blue-500"><div className="text-xs text-gray-500 font-bold mb-1">加盟出貨</div><div className="flex justify-between items-baseline"><span className="text-xs text-gray-400">總計</span><span className="text-lg font-bold text-blue-700">${stats.shipmentRev.toLocaleString()}</span></div><div className="flex justify-between items-baseline"><span className="text-xs text-gray-400">毛利</span><span className="text-sm font-bold text-green-600">+${stats.shipmentMargin.toLocaleString()}</span></div></div>
                                <div className="bg-cyan-50 p-3 rounded shadow border-l-4 border-cyan-500"><div className="text-xs text-gray-500 font-bold mb-1">直營店 (湳雅)</div><div className="flex justify-between items-baseline"><span className="text-xs text-gray-400">業績</span><span className="text-lg font-bold text-cyan-700">${stats.directStoreSales.toLocaleString()}</span></div><div className="flex justify-between items-baseline"><span className="text-xs text-gray-400">總支出</span><span className="text-sm text-red-400">-${(stats.directStoreExp + stats.directStoreCost).toLocaleString()}</span></div><div className="border-t border-cyan-200 mt-1 pt-1 flex justify-between"><span className="text-xs font-bold">淨利</span><span className={`text-sm font-bold ${stats.directStoreNet>=0?'text-green-600':'text-red-600'}`}>${stats.directStoreNet.toLocaleString()}</span></div></div>
                                <div className="bg-indigo-50 p-3 rounded shadow border-l-4 border-indigo-500"><div className="text-xs text-gray-500 font-bold mb-1">加盟開通</div><div className="flex justify-between items-baseline"><span className="text-xs text-gray-400">收入</span><span className="text-lg font-bold text-indigo-700">${stats.franchiseRev.toLocaleString()}</span></div><div className="flex justify-between items-baseline"><span className="text-xs text-gray-400">成本</span><span className="text-sm text-red-400">-${stats.franchiseCost.toLocaleString()}</span></div>{stats.franchiseTaxTotal > 0 && <div className="text-[10px] text-red-500 font-bold text-right mt-1">含發票稅額: ${stats.franchiseTaxTotal.toLocaleString()}</div>}<div className="border-t border-indigo-200 mt-1 pt-1 flex justify-between"><span className="text-xs font-bold">損益</span><span className="text-sm font-bold text-indigo-600">+${stats.franchiseProfit.toLocaleString()}</span></div></div>
                                <div className="bg-yellow-50 p-3 rounded shadow border-l-4 border-yellow-500 flex flex-col justify-center"><div className="text-xs text-gray-500 font-bold mb-2">公司總淨利 (Net Profit)</div><div className={`text-2xl font-bold ${companyNetProfit>=0?'text-yellow-700':'text-red-600'}`}>${companyNetProfit.toLocaleString()}</div><div className="text-[10px] text-gray-400 mt-1">扣除調撥/營運雜支/直營成本</div></div>
                            </div>

                            <div className="bg-white p-4 rounded shadow border">
                                <div className="flex justify-between items-center mb-3 border-b pb-2">
                                    <h3 className="font-bold text-gray-700"><i className="fa-solid fa-building-columns mr-2 text-gray-400"></i>每月固定成本 (x{monthsInRange}個月)</h3>
                                    <span className="text-sm font-bold text-red-600 bg-red-50 px-3 py-1 rounded-full">區間合計: -${totalFixedForRange.toLocaleString()}</span>
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-3">
                                    <div className="bg-cyan-50 p-2 rounded border border-cyan-100">
                                        <div className="text-[10px] text-gray-500 font-bold mb-1">湳雅直營固定成本</div>
                                        <div className="text-xs space-y-0.5">
                                            <div className="flex justify-between"><span>人員薪資</span><span className="font-bold text-red-500">${(dfc.salary||0).toLocaleString()}</span></div>
                                            <div className="flex justify-between"><span>倉庫租金</span><span className="font-bold text-red-500">${(dfc.warehouseRent||0).toLocaleString()}</span></div>
                                            <div className="flex justify-between"><span>攤位租金</span><span className="font-bold text-red-500">${(dfc.boothRent||0).toLocaleString()}</span></div>
                                            <div className="flex justify-between border-t pt-1 mt-1"><span className="font-bold">小計</span><span className="font-bold text-red-600">${directFixedTotal.toLocaleString()}</span></div>
                                        </div>
                                    </div>
                                    <div className="bg-indigo-50 p-2 rounded border border-indigo-100">
                                        <div className="text-[10px] text-gray-500 font-bold mb-1">公司固定成本</div>
                                        <div className="text-xs space-y-0.5">
                                            <div className="flex justify-between"><span>公司租金</span><span className="font-bold text-red-500">${(cfc.officeRent||0).toLocaleString()}</span></div>
                                            <div className="flex justify-between"><span>中信貸款</span><span className="font-bold text-red-500">${(cfc.ctbcLoan||0).toLocaleString()}</span></div>
                                            <div className="flex justify-between"><span>中租貸款</span><span className="font-bold text-red-500">${(cfc.chaileaseLoan||0).toLocaleString()}</span></div>
                                            <div className="flex justify-between border-t pt-1 mt-1"><span className="font-bold">小計</span><span className="font-bold text-red-600">${companyFixedTotal.toLocaleString()}</span></div>
                                        </div>
                                    </div>
                                    <div className="bg-yellow-50 p-2 rounded border border-yellow-200 flex flex-col justify-center items-center col-span-2 md:col-span-1">
                                        <div className="text-[10px] text-gray-500 font-bold mb-1">扣除固定成本後淨利</div>
                                        <div className={`text-xl font-bold ${companyNetProfitAfterFixed >= 0 ? 'text-green-600' : 'text-red-600'}`}>${companyNetProfitAfterFixed.toLocaleString()}</div>
                                        <div className="text-[9px] text-gray-400 mt-1">每月固定: ${allFixedCosts.toLocaleString()}</div>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="bg-white p-4 rounded shadow h-[350px]"><canvas ref={expenseChartRef}></canvas></div>
                                <div className="bg-white p-4 rounded shadow h-[350px] flex flex-col"><div className="flex gap-2 text-xs font-bold text-gray-500 mb-2 justify-center bg-gray-50 p-2 rounded"><span>花枝: {frozenStats.totalQty.cut}箱</span><span>墨魚: {frozenStats.totalQty.squid}箱</span><span>蝦球: {frozenStats.totalQty.shrimp}箱</span><span>牛蒡: {frozenStats.totalQty.burdock}箱</span></div><div className="flex-1 relative"><canvas ref={franchiseChartRef}></canvas></div></div>
                            </div>

                            <div className="bg-white p-4 rounded shadow">
                                <div className="flex justify-between items-center mb-4 border-b pb-2">
                                    <h3 className="font-bold text-gray-700">交易流水帳</h3>
                                    <select value={filterType} onChange={e=>setFilterType(e.target.value)} className="border p-1 rounded text-sm"><option value="all">全部顯示</option><option value="recent">最近新增 30 筆 (不限區間)</option><option value="order">出貨紀錄</option><option value="transfer">調撥紀錄</option><option value="stockIn">進貨/支出</option><option value="franchise">加盟開通</option></select>
                                </div>
                                <div className="space-y-2 max-h-[500px] overflow-y-auto">
                                    {displayTrans.map(t => (
                                        <div key={t.id} className="border rounded p-3 text-sm relative hover:bg-gray-50">
                                            <div className="flex justify-between font-bold mb-1">
                                                <span className="flex items-center gap-2">
                                                    <span className={`px-2 py-0.5 rounded text-white text-xs ${t.type==='出貨'?'bg-blue-500':t.type==='直營報表'?'bg-cyan-500':t.type==='加盟'?'bg-indigo-500':t.type==='進貨/支出'?'bg-red-500':t.type==='應收帳款'?'bg-purple-500':'bg-gray-500'}`}>{t.type}</span>
                                                    <span>{txMoment(t).format('YYYY/MM/DD')}{!hasValidDate(t) && <span className="text-[10px] text-red-500 ml-1">(日期空白，以建立日計)</span>}</span>
                                                    <span className="text-gray-600">- {t.franchise}</span>
                                                    {t.createdBy && <span className="text-[10px] text-gray-400 ml-2">({t.createdBy.split('@')[0]})</span>}
                                                    <span className={`text-[10px] px-1 rounded ${t._pending ? 'bg-orange-100 text-orange-700' : 'bg-green-50 text-green-600'}`}>{t._pending ? '同步中…' : '已存雲端'}</span>
                                                    {filterType === 'recent' && <span className="text-[10px] text-gray-400">登錄於 {moment(t.id).format('MM/DD HH:mm')}</span>}
                                                </span>
                                                <span className={t.total < 0 ? 'text-red-500' : 'text-green-600'}>${t.total?.toLocaleString()}</span>
                                            </div>
                                            <pre className="text-xs text-gray-500 whitespace-pre-wrap font-sans bg-gray-100 p-2 rounded">{t.content}</pre>
                                            {!isReadonly && <button onClick={() => onDelete(t.id, t.type)} className="absolute top-3 right-3 text-gray-300 hover:text-red-500"><i className="fa-solid fa-trash"></i></button>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="bg-white p-4 rounded shadow animate-fade-in">
                            <div className="flex justify-between items-center mb-4 border-b pb-2">
